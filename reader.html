<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f5f1"><title>MIN WORKS · 오늘의 현장</title><link rel="manifest" href="reader.webmanifest"><link rel="stylesheet" href="reader.css?v=2"></head><body>
<main>
<header><div><span class="brand">MIN WORKS <i>BRIEF</i></span><div class="title-row"><h1>오늘의 현장</h1><span class="count"><b id="count">—</b>건</span></div></div><button id="refresh" aria-label="새로고침">↻</button></header>
<nav aria-label="일보 날짜"><button id="today" class="selected">오늘</button><button id="yesterday">전일</button><label class="date-label"><input type="date" id="date" aria-label="조회 날짜"></label></nav>
<div class="status-line"><span id="summaryLabel">오늘 올라온 공사일보</span><span id="sync">연결 확인 중</span></div>
<p id="notice" role="status"></p><section id="reports" aria-label="현장별 공사일보" aria-roledescription="캐러셀" tabindex="0"></section>
<footer><div class="pager"><button id="prevSite" aria-label="이전 현장">←</button><div><strong id="pagePosition" aria-live="polite">0 / 0 현장</strong><small id="swipeHint">좌우로 넘겨 현장 보기</small></div><button id="nextSite" aria-label="다음 현장">→</button></div></footer>
</main>
<dialog id="photoDialog" aria-label="현장사진 확대"><div class="photo-toolbar"><span id="photoCount"></span><button id="closePhoto" aria-label="사진 닫기">닫기 ✕</button></div><div class="photo-stage"><img id="largePhoto" alt="확대 현장사진"></div><div class="photo-controls"><button id="prevPhoto" aria-label="이전 사진">← 이전</button><button id="zoomPhoto">확대 ＋</button><button id="nextPhoto" aria-label="다음 사진">다음 →</button></div></dialog>
<dialog id="detailDialog" aria-label="공사일보 전체 내용"><header><h2>공사일보 전체 내용</h2><button id="closeDetail">닫기 ✕</button></header><div id="detailContent"></div></dialog>
<script src="reader.js?v=2"></script></body></html>
