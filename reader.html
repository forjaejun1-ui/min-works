<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f5f1"><title>민웍스+ · 민웍스 플러스</title><meta name="apple-mobile-web-app-title" content="민웍스+"><link rel="icon" href="plus-icon-design.svg"><link rel="apple-touch-icon" href="plus-icon-design-180.png"><link rel="manifest" href="reader.webmanifest?v=design79"><link rel="stylesheet" href="reader.css?v=design79"><link rel="stylesheet" href="plus-auth.css?v=61"></head><body>
<main hidden>
<header class="plus-header"><div class="plus-heading"><span class="plus-eyebrow">FIELD BRIEF</span><h1>MIN WORKS<span class="plus-mark">+</span></h1></div><div class="reader-header-actions"><div class="reader-action-buttons"><button id="plusAccount" aria-label="내 계정">계정</button><button id="plusInstall">설치</button><button id="refresh" aria-label="새로고침">↻</button></div><span id="sync">연결 확인 중</span></div></header>
<nav aria-label="일보 날짜"><button id="today" class="selected"><span>오늘</span><em id="todayUnread" class="unread-badge" hidden></em></button><button id="yesterday"><span>전일</span><em id="yesterdayUnread" class="unread-badge" hidden></em></button><div class="active-site-summary" aria-live="polite"><span>진행 중 현장</span><strong id="activeSiteCount" class="unread-badge site-count-badge">—</strong></div><span id="summaryLabel" class="visually-hidden">오늘 올라온 공사일보</span></nav>
<p id="notice" role="status"></p><section id="reports" aria-label="현장별 공사일보" aria-roledescription="캐러셀" tabindex="0"></section>
<footer><div class="pager"><button id="prevSite" aria-label="이전 현장">←</button><div><strong id="pagePosition" aria-live="polite">0 / 0 현장</strong><small id="swipeHint">좌우로 넘겨 현장 보기</small></div><button id="nextSite" aria-label="다음 현장">→</button></div></footer>
</main>
<dialog id="photoDialog" aria-label="현장사진 확대"><div class="photo-toolbar"><span id="photoCount"></span><button id="closePhoto" aria-label="사진 닫기">닫기 ✕</button></div><div class="photo-stage"><img id="largePhoto" alt="확대 현장사진"></div><p class="photo-swipe-hint">좌우로 넘겨 사진 보기</p><div class="photo-controls"><button id="prevPhoto" aria-label="이전 사진">← 이전</button><button id="zoomPhoto">확대 ＋</button><button id="nextPhoto" aria-label="다음 사진">다음 →</button></div></dialog>

<script src="plus-auth.js?v=plus69"></script><script src="reader.js?v=design79"></script><script src="device-session.js?v=63"></script></body></html>
