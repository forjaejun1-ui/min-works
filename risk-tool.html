<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>현장 위험성평가 관리 v8.16R5 - 공정명/개정정보 분리 · A4 가로 고정</title>
<style>
:root{
  --line:#222; --soft:#f2f3f5; --head:#d9eef3; --accent:#2e7d32;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;background:#eef1f4;color:#111}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.topbar{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #ccc;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;margin-right:8px}
.badge{padding:4px 8px;border-radius:999px;font-size:12px;background:#eee}
.badge.shared{background:#dff4e2;color:#165d1b}
.badge.local{background:#fff0d2;color:#7b4d00}
.badge.conflict{background:#ffd9d9;color:#840000}
button.primary{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:8px 12px}
button.secondary{background:#fff;border:1px solid #aaa;border-radius:6px;padding:8px 12px}
.wrap{display:grid;grid-template-columns:360px 1fr;gap:14px;padding:14px}
.panel{background:#fff;border:1px solid #ccd1d6;border-radius:8px;padding:14px}
.panel h2,.panel h3{margin:0 0 10px}
.row{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;margin-bottom:8px}
.row label{font-size:13px;font-weight:700}
input,select,textarea{width:100%;border:1px solid #aaa;border-radius:4px;padding:7px;background:#fff}
textarea{min-height:68px;resize:vertical}
.small{font-size:12px;color:#555}
.trade-list{max-height:330px;overflow:auto;border:1px solid #ddd;padding:8px;border-radius:6px}
.trade-item{display:flex;align-items:center;gap:8px;padding:5px 2px}
.trade-item input{width:auto}
.doclist{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.docpill{padding:6px 9px;border:1px solid #bbb;border-radius:999px;background:#fff;font-size:12px}
.docpill.active{background:#e6f2e7;border-color:#3c8d42}
.a4-scroll{overflow:auto}
.sheet{width:1123px;min-height:794px;margin:0 auto 16px;background:#fff;border:2px solid #1b3ccc;box-shadow:0 2px 12px rgba(0,0,0,.12);position:relative}
.sheet table{border-collapse:collapse;width:100%;table-layout:fixed}
.sheet td,.sheet th{border:1px solid var(--line);padding:4px;vertical-align:middle}
.center{text-align:center}.bold{font-weight:800}.title{font-size:32px;font-weight:900;letter-spacing:4px}
.headbg{background:var(--head)}
.gray{background:#ddd}
.sign{color:#aaa}
.cover-top{height:125px}
.cover-body{padding:22px 190px}
.cover-body table td{height:38px}
.pagewater{position:absolute;inset:45% 0 auto;text-align:center;font-size:64px;color:rgba(0,0,0,.18);pointer-events:none}
.process-title{font-size:25px;font-weight:900}
.proc td{font-size:12px}
.proc .h{font-weight:800;background:#ddd;text-align:center}
.riskblock{line-height:1.5}
.footer-note{font-size:10px;padding:6px 10px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.hidden{display:none!important}
.statusline{font-size:12px;margin-left:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50}
.modal .box{width:min(760px,92vw);max-height:86vh;overflow:auto;background:#fff;border-radius:10px;padding:18px}
pre.code{white-space:pre-wrap;background:#111;color:#eee;padding:10px;border-radius:6px;font-size:12px}

.approval-grid td{border:1px solid var(--line)!important;padding:2px 3px!important;height:24px}
.cover-top>tbody>tr>td:last-child .approval-grid{margin:-1px;width:calc(100% + 2px);height:calc(100% + 2px)}


.signline{display:flex;align-items:center;justify-content:space-between;gap:18px;white-space:nowrap}
.process-grid>tbody>tr>td{border:0!important}
.proc textarea{min-height:50px;font-size:10.5px;line-height:1.3;padding:3px;border:0;background:transparent}
.proc .riskblock textarea{min-height:42px}
.approval-grid td{font-size:12px}
.cover-top td{white-space:nowrap}


.placefield{white-space:nowrap;overflow:hidden;font-size:9.5px!important;text-align:center}
.measure-once{min-height:150px!important}
.proc td:nth-last-child(-n+2){vertical-align:middle}


.compact-eval td,.compact-rev td{height:20px!important;padding:1px 4px!important;line-height:1.05!important;font-size:11px!important}
.proc .h{line-height:1.15}
.placefield{white-space:pre-line!important;overflow:visible!important;font-size:10px!important;text-align:center;min-height:48px!important}
.person-input{border:0!important;background:transparent!important;text-align:center!important;padding:2px!important;font-weight:700;width:100%}
.proc textarea{white-space:pre-line}


.trade-row{display:grid!important;grid-template-columns:24px minmax(120px,1fr) minmax(110px,.8fr) 34px;gap:6px;align-items:center}
.trade-row .trade-name,.trade-row .foreman-name{min-width:0}
.trade-row .foreman-name{background:#fffdf2}


/* v2.3: 상세내용을 삭제하지 않고 원래 글씨크기를 유지한 채 칸 자체를 넓힘 */
.process-sheet{min-height:794px;height:auto}
.proc-wrap{padding:5px 7px 3px}
.proc td{font-size:11px!important;line-height:1.24!important;padding:3px!important}
.proc .h{font-size:11px!important;line-height:1.15!important;height:27px}
.proc .risk-row{height:57px}
.proc textarea{
  box-sizing:border-box!important;
  width:100%!important;
  height:100%!important;
  min-height:48px!important;
  resize:none!important;
  overflow:hidden!important;
  border:0!important;
  background:transparent!important;
  font-size:10.5px!important;
  line-height:1.22!important;
  padding:2px!important;
  white-space:pre-wrap!important;
  word-break:keep-all!important;
}
.proc td[rowspan="4"] textarea{min-height:218px!important}
.proc td[rowspan="3"] textarea{min-height:160px!important}
.proc .riskblock textarea{min-height:38px!important}
.proc .measure-once{min-height:160px!important}
.placefield{font-size:10.5px!important;line-height:1.25!important;text-align:center!important;white-space:pre-wrap!important}
.person-input{font-size:11px!important}
.sign-right{text-align:right!important;padding-right:8px!important;white-space:nowrap!important}
.footer-note{font-size:9.5px!important;padding:3px 8px!important}


/* v2.4 cover alignment */
.cover-center,
.cover-center input,
.cover-center select,
.cover-center textarea{
  text-align:center!important;
}
.approval-name,
.approval-name input,
.approval-name select{
  text-align:center!important;
}


.approval-person-select{
  width:100%;
  min-width:90px;
  border:0;
  background:#fff;
  font:inherit;
  text-align:center;
  text-align-last:center;
  padding:2px 18px 2px 4px;
}


/* v2.5 detail fixes */
.cover-center{
  text-align:center!important;
  vertical-align:middle!important;
}
.cover-center input,
.cover-center select,
.approval-name{
  text-align:center!important;
  text-align-last:center!important;
}
.approval-person-select{
  text-align:center!important;
  text-align-last:center!important;
}


/* v2.6 날짜선택 / 담당자선택 */
.date-range{
  display:grid;
  grid-template-columns:minmax(0,1fr) 18px minmax(0,1fr);
  gap:4px;
  align-items:center;
  width:100%;
}
.date-range input[type="date"]{
  min-width:0;
  width:100%;
  text-align:center;
}
.range-mark{
  text-align:center;
  font-weight:700;
}
.risk-person-select{
  width:100%!important;
  border:0!important;
  background:transparent!important;
  text-align:center!important;
  text-align-last:center!important;
  font-size:11px!important;
}
.sign-center{
  text-align:center!important;
  padding-left:0!important;
  padding-right:0!important;
  white-space:nowrap!important;
}


/* v2.7 결재/탭 UX */
.signline{
  display:flex!important;
  align-items:center!important;
  justify-content:space-between!important;
  gap:6px!important;
  width:100%!important;
  max-width:100%!important;
  box-sizing:border-box!important;
  padding:0 3px!important;
  white-space:nowrap!important;
}
.signline .sign{
  flex:0 0 auto!important;
  margin-left:4px!important;
}
.middle-approval td{
  vertical-align:middle!important;
}
.sign-center{
  text-align:center!important;
  padding-left:0!important;
  padding-right:0!important;
}


@media(max-width:900px){
  .wrap{grid-template-columns:1fr}
  .a4-scroll{overflow-x:auto}
}
@media print{
  body{background:#fff}
  .topbar,.left,.doclist,.noprint{display:none!important}
  .wrap{display:block;padding:0}
  .panel{border:0;padding:0}
  .sheet{box-shadow:none;margin:0;border:0;width:297mm;min-height:210mm;page-break-after:always}
  .sheet:last-child{page-break-after:auto}

}

@media print{
  .process-sheet{height:210mm!important;min-height:210mm!important;overflow:hidden!important}
  .proc tr{break-inside:avoid;page-break-inside:avoid}
  .proc textarea{overflow:hidden!important}
}


/* v4.2: 문장 단위 표시 + 셀 넘침 방지 */
.proc td{overflow:hidden!important}
.proc textarea{
  overflow:hidden!important;
  resize:none!important;
  white-space:pre-wrap!important;
  overflow-wrap:anywhere!important;
  word-break:keep-all!important;
}
.proc .risk-row{height:57px!important;max-height:57px!important}
.proc .risk-row td{height:57px!important;max-height:57px!important;overflow:hidden!important}


/* v4.3: 위해·위험요인은 핵심만, 후속조치는 박스 범위 내 상세 표시 */
.proc textarea{font-size:10.2px!important;line-height:1.17!important;padding:2px!important}
.proc td:nth-child(4) textarea{font-size:10px!important;line-height:1.16!important}
.proc td:nth-child(5) textarea,
.proc td:nth-child(8) textarea,
.proc td:nth-child(9) textarea,
.proc td:nth-child(10) textarea{font-size:9.6px!important;line-height:1.12!important}


/* v5.2: 4줄 고정 공정탭 + 좌측 여백 제거 + A4 가로 비율 */
.left{
  position:sticky;
  top:68px;
  align-self:start;
  max-height:calc(100vh - 82px);
  overflow:auto;
  scrollbar-gutter:stable;
}

/* 우측 문서영역의 불필요한 좌측 빈 공간 제거 */
.wrap{
  grid-template-columns:340px minmax(0,1fr);
  gap:8px;
  padding:8px;
}
main.panel{
  padding:8px;
  min-width:0;
}
.a4-scroll{
  overflow:auto;
  padding:0;
}
.a4-scroll .sheet{
  margin-left:0!important;
  margin-right:0!important;
}

/* 공정 바로가기: 기존 느낌을 유지하되 정확히 4줄로 구성 */
.doclist{
  position:sticky;
  top:68px;
  z-index:19;
  display:block;
  overflow-x:auto;
  overflow-y:hidden;
  background:#fff;
  padding:7px 6px 8px;
  margin:-4px 0 8px;
  border-bottom:1px solid #d7dce1;
  box-shadow:0 4px 8px rgba(0,0,0,.05);
  scrollbar-width:thin;
}
.docrow{
  display:flex;
  gap:5px;
  align-items:center;
  min-width:max-content;
  margin:2px 0;
}
.docpill{
  flex:0 0 auto;
  cursor:pointer;
  user-select:none;
  padding:5px 8px;
  line-height:1.15;
  font-size:11px;
  transition:background .15s,border-color .15s,color .15s;
}
.docpill:hover{background:#eef7ef;border-color:#5b9f60}
.docpill.active{background:#2e7d32!important;border-color:#2e7d32!important;color:#fff}

/* 화면에서도 A4 가로형(297:210) 비율을 기준으로 유지 */
.sheet{
  width:1123px;
  min-height:794px;
  aspect-ratio:297 / 210;
  scroll-margin-top:205px;
}
.process-sheet{
  min-height:794px;
}

/* 화면 폭이 좁을 때도 문서는 좌측부터 시작 */
@media(max-width:1500px){
  .wrap{grid-template-columns:320px minmax(0,1fr)}
}
@media(max-width:900px){
  .wrap{grid-template-columns:1fr;padding:6px}
  .left{position:relative;top:auto;max-height:none;overflow:visible}
  .doclist{top:62px}
  main.panel{padding:4px}
}
@media print{
  .left,.doclist{position:static!important;max-height:none!important;overflow:visible!important}
  .sheet{
    width:297mm!important;
    min-height:210mm!important;
    aspect-ratio:auto!important;
    margin:0!important;
  }
}


/* v5.3: 직접수정 UX + A4 가로 페이지 깨짐 방지 */
.process-sheet{
  width:1123px!important;
  height:794px!important;
  min-height:794px!important;
  max-height:794px!important;
  overflow:hidden!important;
}
.process-sheet .cover-top{height:116px!important}
.process-sheet .process-title{font-size:23px!important;line-height:1.1!important}

.proc .h{height:24px!important;font-size:10.5px!important;line-height:1.08!important;padding:2px!important}
.proc .risk-row{height:52px!important;max-height:52px!important}
.proc .risk-row td{height:52px!important;max-height:52px!important;overflow:hidden!important}
.proc td[rowspan="4"] textarea{min-height:194px!important;max-height:194px!important}
.proc td[rowspan="3"] textarea{min-height:142px!important;max-height:142px!important}
.proc .riskblock{padding:1px 3px!important;line-height:1.05!important}
.proc .riskblock b{display:block;font-size:9.5px;line-height:1.05;margin:0 0 1px}
.proc .riskblock textarea{
  min-height:25px!important;
  height:25px!important;
  max-height:25px!important;
  font-size:9.4px!important;
  line-height:1.08!important;
  padding:1px!important;
}

}
.proc .measure-once{
  min-height:136px!important;

  font-size:9.4px!important;

}
.footer-note{
  font-size:8.7px!important;
  line-height:1.15!important;
  padding:2px 8px!important;
}

/* 위험성평가 본문은 마우스를 올리면 바로 수정 가능한 상태를 명확히 표시 */
.proc textarea,.proc input,.proc select{
  cursor:text!important;
  transition:background .12s, box-shadow .12s;
}
.proc textarea:hover,.proc input:hover,.proc textarea:focus,.proc input:focus{
  background:#fffde8!important;
  box-shadow:inset 0 0 0 1px #d4a600!important;
  outline:none!important;
}
.proc textarea::selection,.proc input::selection{background:#cfe8ff}

/* 화면/출력 모두 페이지 외부로 내용이 밀려나지 않도록 고정 */
.sheet{overflow:hidden}

  .process-sheet{
    width:297mm!important;
    height:210mm!important;
    min-height:210mm!important;
    max-height:210mm!important;
    overflow:hidden!important;
  }
  .proc textarea,.proc input{background:transparent!important;box-shadow:none!important}
}


/* v6.0: 카테고리형 공정선택 + 갑지 직접수정 */
.cover-edit-guide{

/* v7.4 ---------------------------------------------------
   문서 테두리를 두 종류만 사용
   - 얇은 내부선: 1px
   - 굵은 외곽선: 2px
   설정 UI에는 적용하지 않음
--------------------------------------------------------- */
.sheet{
  --doc-thin:1px solid #000;
  --doc-thick:2px solid #000;
}

/* 기본 원칙: 모든 셀 내부 구획선은 동일한 얇은선 */
.sheet table{
  border-collapse:collapse!important;
  border-spacing:0!important;
}
.sheet th,
.sheet td{
  border:var(--doc-thin)!important;
}

/* 각 독립 박스의 외곽선은 모두 동일한 굵은선 */
.sheet .cover-top,
.sheet .compact-eval,
.sheet .compact-rev,
.sheet .cover-info-table,
.sheet .cover-review-table,
.sheet .cover-final-approval,
.sheet .middle-approval,

  border:var(--doc-thick)!important;
}

/* 갑지/중갑지/공정페이지 상단 평가승인:
   바깥 cover-top이 외곽선을 담당하고 내부 approval-grid는 내부 구획선만 담당 */
.sheet .approval-cell{
  border-left:var(--doc-thick)!important;
  border-top:0!important;
  border-right:0!important;
  border-bottom:0!important;
  padding:0!important;
}
.sheet .approval-grid{
  border:0!important;
  border-collapse:collapse!important;
}
.sheet .approval-grid td{
  border:var(--doc-thin)!important;
}
.sheet .approval-grid tr:first-child>td{border-top:0!important}
.sheet .approval-grid tr:last-child>td{border-bottom:0!important}
.sheet .approval-grid tr>td:first-child{border-left:0!important}
.sheet .approval-grid tr>td:last-child{border-right:0!important}

/* 수시/최초 위험성평가표 상단의 작업기간 박스:
   작업기간 영역 좌·우 경계는 반드시 굵은선 */
.sheet .cover-top>tbody>tr:nth-child(3)>td:nth-child(3){

#page-middle .process-grid{
  border:0!important;

  border:0!important;

  border:var(--doc-thin)!important;

/* =========================================================
   v8.16R2 — 평가·승인 박스 하단 이중선 확실히 제거
   - cover-top 본표가 바깥 외곽선을 담당
   - approval-grid는 외곽선 0
   - approval-grid에는 내부 구획선만 직접 지정
   ========================================================= */

/* 메인 표의 평가승인 셀: 바깥선은 cover-top과 공유, 왼쪽 분리선만 명확히 유지 */
.sheet .cover-top>tbody>tr>td.approval-cell{
  position:relative!important;
  padding:0!important;
  margin:0!important;
  overflow:hidden!important;

  /* 같은 cover-top 표의 바깥 테두리와 겹치지 않게 함 */
  border-top:0!important;
  border-right:0!important;
  border-bottom:0!important;
  border-left:2px solid #000!important;
}

/* 중첩 승인표 자체에는 외곽선을 절대 만들지 않음 */
.sheet .cover-top td.approval-cell>.approval-grid{
  position:absolute!important;
  inset:0!important;
  width:100%!important;
  height:100%!important;
  margin:0!important;
  padding:0!important;
  border:0!important;
  outline:0!important;
  box-shadow:none!important;
  border-collapse:collapse!important;
  border-spacing:0!important;
  table-layout:fixed!important;
}

/* 일단 모든 셀 선을 0으로 초기화 */
.sheet .cover-top td.approval-cell>.approval-grid td{
  border:0!important;
  outline:0!important;
  box-shadow:none!important;
}

/* ---------- 세로 내부 구분선 ---------- */

/* 평가&승인 세로칸 오른쪽 */
.sheet .cover-top td.approval-cell>.approval-grid tr:first-child>td:nth-child(1){
  border-right:1px solid #000!important;
}

/* 1행: 작성자 | 협력업체 | 서명 */
.sheet .cover-top td.approval-cell>.approval-grid tr:nth-child(1)>td:nth-child(2),
.sheet .cover-top td.approval-cell>.approval-grid tr:nth-child(1)>td:nth-child(3){
  border-right:1px solid #000!important;
}

/* 2행: 검토자(rowspan) | 안전관리자 | 서명 */
.sheet .cover-top td.approval-cell>.approval-grid tr:nth-child(2)>td:nth-child(1),
.sheet .cover-top td.approval-cell>.approval-grid tr:nth-child(2)>td:nth-child(2){
  border-right:1px solid #000!important;
}

/* 3,4행: 역할 | 서명 */
.sheet .cover-top td.approval-cell>.approval-grid tr:nth-child(3)>td:nth-child(1),
.sheet .cover-top td.approval-cell>.approval-grid tr:nth-child(4)>td:nth-child(1){
  border-right:1px solid #000!important;
}

/* 5행: 승인자(colspan2) | 서명 */
.sheet .cover-top td.approval-cell>.approval-grid tr:nth-child(5)>td:nth-child(1){
  border-right:1px solid #000!important;
}

/* ---------- 가로 내부 구분선 ---------- */

/* 1행 아래: 첫 rowspan칸은 제외 */
.sheet .cover-top td.approval-cell>.approval-grid tr:nth-child(1)>td:nth-child(n+2){
  border-bottom:1px solid #000!important;
}

/* 2행 아래: 검토자 rowspan칸 제외, 안전관리자/서명만 */
.sheet .cover-top td.approval-cell>.approval-grid tr:nth-child(2)>td:nth-child(n+2){
  border-bottom:1px solid #000!important;
}

/* 3행 아래 */
.sheet .cover-top td.approval-cell>.approval-grid tr:nth-child(3)>td{
  border-bottom:1px solid #000!important;
}

/* 4행 아래:
   검토자 rowspan 셀의 끝 + 공사책임자/서명 셀을 합쳐
   승인자 행 위의 한 줄을 완성 */
.sheet .cover-top td.approval-cell>.approval-grid tr:nth-child(2)>td:nth-child(1),
.sheet .cover-top td.approval-cell>.approval-grid tr:nth-child(4)>td{
  border-bottom:1px solid #000!important;
}

/* 중요: 마지막(승인자) 행 아래에는 내부 border를 절대 만들지 않음 */
.sheet .cover-top td.approval-cell>.approval-grid tr:last-child>td{
  border-bottom:0!important;
}

/* 평가&승인 rowspan 셀 역시 실제 하단이 표 맨 아래이므로 하단선 금지 */
.sheet .cover-top td.approval-cell>.approval-grid tr:first-child>td[rowspan="5"]{
  border-bottom:0!important;
}

/* 바깥 오른쪽/위/아래도 nested grid에서는 항상 0 */
.sheet .cover-top td.approval-cell>.approval-grid tr:first-child>td{
  border-top:0!important;
}
.sheet .cover-top td.approval-cell>.approval-grid tr>td:last-child{
  border-right:0!important;
}
.sheet .cover-top td.approval-cell>.approval-grid tr:last-child>td{
  border-bottom:0!important;
}

@media print{
  /* 출력에서도 똑같이: 승인표 하단은 nested table이 아니라 cover-top 외곽선 1개만 표시 */
  .sheet .cover-top>tbody>tr>td.approval-cell{
    border-top:0!important;
    border-right:0!important;
    border-bottom:0!important;
    border-left:2px solid #000!important;
  }

  .sheet .cover-top td.approval-cell>.approval-grid{
    border:0!important;
    outline:0!important;
    box-shadow:none!important;
  }

  .sheet .cover-top td.approval-cell>.approval-grid tr:last-child>td,
  .sheet .cover-top td.approval-cell>.approval-grid tr:first-child>td[rowspan="5"]{
    border-bottom:0!important;
  }

function $id(id){return document.getElementById(id)}

function cleanVisibleBreaks(v){
  return String(v??"")
    .replace(/\\n\s*\d*/gi," / ")
    .replace(/\s*\/\s*\/\s*/g," / ")
    .replace(/\s*·\s*·\s*/g," · ")
    .replace(/\s{2,}/g," ")
    .trim();
}
function esc(v){
  return cleanVisibleBreaks(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}

function formatDateKR(v){
  const s=String(v||"").trim();
  if(!s) return "";
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[1]}.${m[2]}.${m[3]}` : s;
}
function buildWorkPeriod(){
  const sEl=document.querySelector('[data-work-period-part="start"]');
  const eEl=document.querySelector('[data-work-period-part="end"]');
  const s=sEl?.value||state.fields.workPeriodStart||"";
  const e=eEl?.value||state.fields.workPeriodEnd||"";
  const value=(s||e) ? `${formatDateKR(s)} ~ ${formatDateKR(e)}` : (state.fields.workPeriod||"");
  state.fields.workPeriodStart=s;
  state.fields.workPeriodEnd=e;
  state.fields.workPeriod=value;
  return value;
}
function workPeriodEditor(){
  const s=state.fields.workPeriodStart||"";
  const e=state.fields.workPeriodEnd||"";
  const text=state.fields.workPeriod||((s||e)?`${formatDateKR(s)} ~ ${formatDateKR(e)}`:"");
  return `<span class="work-period-editor">
    <span class="work-period-screen">
      <input class="cover-edit period-date" type="date" tabindex="40" data-work-period-part="start" value="${esc(s)}"
        oninput="updateWorkPeriodRange('start',this.value)">
      <span class="period-sep">~</span>
      <input class="cover-edit period-date" type="date" tabindex="50" data-work-period-part="end" value="${esc(e)}"
        oninput="updateWorkPeriodRange('end',this.value)">
    </span>
    <span class="work-period-print common-value" data-common-field="workPeriod">${esc(text)}</span>
  </span>`;
}
function updateWorkPeriodRange(part,value){
  if(part==="start") state.fields.workPeriodStart=value||"";
  else state.fields.workPeriodEnd=value||"";
  const s=state.fields.workPeriodStart||"";
  const e=state.fields.workPeriodEnd||"";
  const text=(s||e)?`${formatDateKR(s)} ~ ${formatDateKR(e)}`:"";
  state.fields.workPeriod=text;
  document.querySelectorAll('[data-work-period-part="start"]').forEach(el=>{if(el!==document.activeElement)el.value=s;});
  document.querySelectorAll('[data-work-period-part="end"]').forEach(el=>{if(el!==document.activeElement)el.value=e;});
  document.querySelectorAll('[data-common-field="workPeriod"]').forEach(el=>el.textContent=text);
  markDirty();
}
function tradeOrderKey(t){
  const cat=tradeCategoryOf(t);
  const ci=TRADE_CATEGORIES.indexOf(cat);
  const arr=TRADE_CATEGORY_MAP[cat]||[];
  const ti=arr.indexOf(t.name);
  return [(ci<0?999:ci),(ti<0?999:ti)];
}
function orderedTrades(list){
  return [...list].sort((a,b)=>{
    const A=tradeOrderKey(a), B=tradeOrderKey(b);
    return A[0]-B[0] || A[1]-B[1] || String(a.name).localeCompare(String(b.name),"ko");
  });
}
function tradesForCategory(cat){
  return orderedTrades(state.trades.filter(t=>tradeCategoryOf(t)===cat));
}
function selectedTrades(){return orderedTrades(state.trades.filter(t=>!!t.selected))}

function updateCategoryClearButton(){

  btn.disabled=!enabled;
  btn.title=activeTradeCategory?`${activeTradeCategory} 대분류에서 선택된 공정만 해제합니다.`:"대분류를 먼저 선택하세요.";

function deselectActiveCategory(){

  if(!affected.length){updateCategoryClearButton();return;}
  affected.forEach(t=>{t.selected=false;});
  if(activeTradeId){
    const active=state.trades.find(t=>t.id===activeTradeId);

function positionTradeSubmenu(){
  const submenu=$id("tradeSubmenu");
  const bar=document.querySelector(".ui-actionbar");
  const active=document.querySelector(`.top-category-cluster[data-category="${activeTradeCategory}"]`);
  if(!submenu||!bar||!active||!activeTradeCategory)return;

  const barRect=bar.getBoundingClientRect();
  const tabRect=active.getBoundingClientRect();
  const width=Math.min(390,Math.max(330,window.innerWidth-24));
  let left=tabRect.left-barRect.left;
  const maxLeft=Math.max(8,barRect.width-width-12);
  left=Math.max(8,Math.min(left,maxLeft));

  submenu.style.width=width+"px";
  submenu.style.left=left+"px";
  submenu.style.top=(tabRect.bottom-barRect.top+6)+"px";
}

  activeTradeId=id||null;

    row.classList.toggle("active",!!activeTradeId && row.dataset.tradeid===activeTradeId);

function renderTradeList(){
  document.querySelectorAll(".top-category-cluster[data-category]").forEach(box=>{
    const cat=box.dataset.category;
    const active=activeTradeCategory===cat;
    box.classList.toggle("active",active);
    const main=box.querySelector(".top-category-main");
    const arrow=box.querySelector(".top-category-arrow");
    if(main)main.classList.toggle("active",active);
    if(arrow){
      arrow.classList.toggle("active",active);
      arrow.textContent=active?"▲":"▼";
      arrow.setAttribute("aria-expanded",active?"true":"false");
    }
  });

  updateCategoryClearButton();

  const submenu=$id("tradeSubmenu");
  const title=$id("activeCategoryTitle");
  const list=$id("tradeList");
  if(!submenu||!list)return;

  if(!activeTradeCategory){
    submenu.classList.add("category-collapsed");
    list.classList.add("category-collapsed");
    list.innerHTML="";
    if(title)title.textContent="";
    return;
  }

  submenu.classList.remove("category-collapsed");
  list.classList.remove("category-collapsed");
  if(title)title.textContent=`${activeTradeCategory} 하위공정`;

  const items=tradesForCategory(activeTradeCategory);
  if(!items.length){
    list.innerHTML=`<div class="trade-empty">등록된 공정이 없습니다.</div>`;
    return;
  }

  list.innerHTML=items.map((t,idx)=>{
    const no=idx+1;
    const display=tradeDisplayName(t);
    return `<div class="trade-item trade-row ${t.selected?"selected":""} ${activeTradeId===t.id?"active":""}" data-tradeid="${t.id}">
      <input class="trade-check" type="checkbox"
        aria-label="${esc(display)} 해당/비해당 선택. 스페이스바로 선택 또는 해제"
        title="Tab으로 이동 · Space로 선택/해제" ${t.selected?"checked":""}
        onchange="toggleTrade('${t.id}',this.checked)">
      <button type="button" class="trade-jump" tabindex="-1"
        title="마우스로 클릭하면 이 공정을 선택하고 해당 위험성평가 페이지로 이동합니다"

async function toggleTrade(id,v){
  const t=state.trades.find(x=>x.id===id);
  if(!t)return;

  const cat=tradeCategoryOf(t);
  activeTradeCategory=cat;
  activeTradeId=id;
  t.selected=!!v;

  /* 현재 행만 즉시 갱신한다.
     tradeList 전체를 다시 만들지 않으므로 키보드 포커스와 Tab 순서가 유지된다. */
  const row=document.querySelector(`.trade-row[data-tradeid="${id}"]`);
  if(row){
    row.classList.toggle("selected",t.selected);
    row.classList.add("active");
    const box=row.querySelector(".trade-check");
    if(box && box.checked!==t.selected) box.checked=t.selected;
  }
  setActiveTrade(id);
  updateCategoryClearButton();

  if(t.selected && (!t.risks || t.risks.length===0)){
    await generateTradeAI(t,false);
  }

  markDirty();

  /* 우측 A4 문서만 갱신하고 좌측 공정목록 DOM은 보존 */
  refreshPagesOnly();
  setActiveTrade(id);
  updateCategoryClearButton();
}

function updateRevisionFromWriteDate(value){
  const s=String(value||"").trim();
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  const revNo=m?`MIN-${m[1].slice(2)}${m[2]}${m[3]}`:"";
  const revDate=m?`${m[1]}-${m[2]}-${m[3]}`:"";
  state.fields.revisionNo=revNo;
  state.fields.revisionDate=revDate;
  document.querySelectorAll('[data-common-field="revisionNo"]').forEach(el=>el.textContent=revNo);
  document.querySelectorAll('[data-common-field="revisionDate"]').forEach(el=>el.textContent=revDate);
}

function companyDisplay(v){
  const s=String(v||"㈜민커뮤니케이션").replace(/<br\s*\/?>/gi," ").replace(/\s+/g," ").trim();
  return `<span class="company-fit-text">${esc(s)}</span>`;
}
function fitCompanyNames(){
  document.querySelectorAll(".process-sheet .company-fit-text").forEach(el=>{
    const parent=el.parentElement;
    if(!parent)return;

    const sheet=el.closest(".process-sheet");
    const ref=sheet?.querySelector('[data-common-field="projectName"]')
      || sheet?.querySelector('[data-common-field="unitTrade"]')
      || sheet?.querySelector(".cover-top .common-value");
    const refStyle=ref ? getComputedStyle(ref) : getComputedStyle(parent);
    const baseSize=parseFloat(refStyle.fontSize)||12.2;
    const baseFamily=refStyle.fontFamily||'"Malgun Gothic","맑은 고딕",Arial,sans-serif';
    const baseWeight=refStyle.fontWeight||"400";
    const baseLetter=refStyle.letterSpacing && refStyle.letterSpacing!=="normal" ? refStyle.letterSpacing : "0px";

    el.style.fontFamily=baseFamily;
    el.style.fontWeight=baseWeight;
    el.style.fontSize=baseSize+"px";
    el.style.letterSpacing=baseLetter;
    el.style.lineHeight=refStyle.lineHeight==="normal" ? "1.12" : refStyle.lineHeight;
    el.style.transform="";
    el.style.transformOrigin="center center";
    el.style.display="inline-block";
    el.style.whiteSpace="nowrap";
    el.style.maxWidth="none";

    const available=Math.max(1,parent.clientWidth-6);
    let size=baseSize;

    /* 기본은 위·아래 글씨와 동일 크기. 실제로 넘칠 때만 최소한으로 축소 */
    while(el.scrollWidth>available && size>9.4){
      size-=0.2;
      el.style.fontSize=size.toFixed(1)+"px";
    }

    /* 아주 긴 업체명도 줄바꿈은 금지하고 마지막 수단으로 가로폭만 미세 조정 */
    if(el.scrollWidth>available){
      const scale=Math.max(0.82,Math.min(1,available/el.scrollWidth));
      el.style.transform=`scaleX(${scale})`;
    }
  });
}

function splitSentences(v){
  return String(v||"")
    .replace(/\s*\/\s*/g,". ")
    .replace(/\s*·\s*/g,". ")
    .split(/(?<=[.!?])\s+|\n+/)
    .map(x=>x.replace(/\s+/g," ").trim().replace(/[.]+$/,""))
    .filter(Boolean);
}
function shortenSentence(s,max=58){
  s=String(s||"").replace(/\s+/g," ").trim();
  const repl=[
    [/작업을 실시한다|작업을 실시/g,"작업"],
    [/확인하여야 한다|확인해야 한다/g,"확인"],
    [/설치하여야 한다|설치해야 한다/g,"설치"],
    [/착용하여야 한다|착용해야 한다/g,"착용"],
    [/사용하여야 한다|사용해야 한다/g,"사용"],
    [/배치하여야 한다|배치해야 한다/g,"배치"],
    [/금지하여야 한다|금지해야 한다/g,"금지"],
    [/준수하여야 한다|준수해야 한다/g,"준수"],
    [/실시하여야 한다|실시해야 한다/g,"실시"],
    [/작업구역 내에서/g,"작업구역에서"],
    [/작업 전 사전에/g,"작업 전"],
    [/여부를 확인/g," 확인"],
    [/\s{2,}/g," "]
  ];
  repl.forEach(([a,b])=>s=s.replace(a,b));
  if(s.length<=max)return s;
  const cut=s.slice(0,max);
  const k=Math.max(cut.lastIndexOf(","),cut.lastIndexOf(" "));
  return (k>max*0.65?cut.slice(0,k):cut).trim();
}
function boxText(v,maxChars=116,maxSent=3){
  const arr=splitSentences(v);
  const out=[];
  for(const x of arr){
    const s=shortenSentence(x,54);
    if(!s)continue;
    const candidate=[...out,s].join("\n");
    if(candidate.length>maxChars||out.length>=maxSent)break;
    out.push(s);
  }
  if(!out.length && v)out.push(shortenSentence(v,Math.min(54,maxChars)));
  return out.map(x=>x.endsWith(".")?x:x+".").join("\n");
}



function cleanLegacyNoise(v){
  let s=String(v||"");
  // 구버전에서 작업/도구 뒤에 붙었던 현장조건 파편 및 반복문구 제거
  s=s.replace(/(?:\/?\s*현장\s*조건|\/?\s*현장조건)\s*\(?\s*\d*\s*(?:위험이\s*있다\.?)?/gi," ");
  s=s.replace(/(?:\/\s*)?현장조건[^,.;\n]*(?:위험이\s*있다\.?)?/gi," ");
  s=s.replace(/\/\s*(?=[,.;]|$)/g," ");
  s=s.replace(/(?:위험이\s*있다\.?\s*){2,}/g,"위험이 있다. ");
  s=s.replace(/\(\s*\d+\s*(?=[,.;]|$)/g," ");
  s=s.replace(/\s*\/\s*\/+\s*/g," ");
  s=s.replace(/\s{2,}/g," ").replace(/\s+([,.])/g,"$1").trim();
  return s;
}

function stripArrows(v){
  return cleanLegacyNoise(v).replace(/→|⇒|➜|➡/g,", ").replace(/\s*,\s*/g,", ").replace(/,\s*,+/g,",").trim();
}
function naturalWorkSentence(v){
  let s=stripArrows(v).replace(/\n/g," ").replace(/[.]+$/,"").trim();
  if(!s)return "";
  const a=s.toLowerCase();
  let topic="";
  const rules=[
    [/천장.*(철거|해체)|(?:철거|해체).*천장/,"천장재 해체"],

    [/바닥.*타일.*(브레이커|파쇄|철거)|타일.*브레이커/,"바닥타일 브레이커 파쇄"],
    [/바닥.*(철거|해체)|(?:철거|해체).*바닥/,"바닥 마감재 철거"],
    [/석고.*(철거|해체)/,"석고보드 해체"],
    [/유리.*(철거|해체)/,"유리 해체"],
    [/문|도어.*(철거|해체)/,"도어 및 문틀 해체"],
    [/배관.*(철거|해체)/,"기존 배관 철거"],
    [/덕트.*(철거|해체)/,"기존 덕트 철거"],
    [/전기.*(철거|해체)|배선.*철거/,"기존 전기배선 철거"],
    [/천장.*(텍스|마이텍스).*(설치|시공)/,"천장 텍스 설치"],
    [/천장.*석고.*(설치|시공)/,"천장 석고보드 설치"],
    [/(경량|스터드).*(벽체|칸막이)/,"경량철골 벽체 설치"],
    [/타일.*(붙|시공|설치)/,"타일 붙임"],
    [/도장|페인트|뿜칠/,"도장"],
    [/필름/,"인테리어 필름 시공"],
    [/도배/,"도배"],
    [/카펫.*타일/,"카펫타일 시공"],
    [/데코.*타일|lvt/,"데코타일 시공"],
    [/장판/,"장판 시공"],
    [/유리.*(설치|취부)/,"유리 설치"],
    [/가구.*(설치|취부)/,"제작가구 설치"],
    [/배관.*(설치|시공|연결)/,"배관 설치 및 연결"],
    [/위생.*기구|세면대|대변기|소변기/,"위생기구 설치"],
    [/덕트.*(설치|시공)/,"덕트 설치"],
    [/에어컨|실외기|냉난방/,"냉난방기 설치"],
    [/케이블.*(포설|인입)|전선.*포설/,"전선 및 케이블 포설"],
    [/분전반.*(설치|결선)/,"분전반 설치 및 결선"],
    [/조명.*(설치|취부)/,"조명기구 설치"],
    [/용접/,"금속부재 용접"],
    [/그라인더.*(절단|연마)|금속.*절단/,"금속부재 그라인더 절단"],
    [/앙카|앵커.*(천공|설치)/,"앙카 천공 및 설치"],
    [/코어.*천공/,"코어 천공"],
    [/실리콘|코킹/,"실리콘 코킹"],
    [/방수/,"방수 시공"],
    [/준공.*청소|청소/,"준공청소"],
    [/자재.*(반입|운반)/,"자재 반입 및 운반"],
    [/양중|인양/,"중량물 양중"],
    [/비계.*(설치|해체)/,"이동식비계 설치 및 해체"],
    [/사다리/,"사다리 사용"],
    [/고소작업대|렌탈|시저|붐리프트/,"고소작업대 사용"]
  ];
  for(const [re,label] of rules){if(re.test(a)){topic=label;break;}}
  if(!topic){
    // 원문 첫 핵심 구절만 취하고 불필요한 단계 나열 및 '작업' 반복 제거
    topic=s.split(/,| 후 | 및 나서 | 다음 /)[0].trim();
    topic=topic.replace(/작업\s*작업/g,"작업").replace(/작업을 실시한다|작업을 진행한다|작업한다/g,"").trim();
    topic=shortenSentence(topic,34).replace(/[.]+$/,"");
  }
  topic=topic.replace(/\b작업\s+작업\b/g,"작업").replace(/작업\s*작업/g,"작업").trim();
  return topic.endsWith("작업")?topic+".":topic+" 작업.";
}

function polishSentence(v,max=118){
  let s=stripArrows(v).replace(/\n+/g," ").replace(/\s+/g," ").trim();
  s=s.replace(/작업\s*작업/g,"작업")
     .replace(/확인하고 확인/g,"확인하고")
     .replace(/점검하고 점검/g,"점검하고")
     .replace(/검토하고 검토/g,"검토하고")
     .replace(/위험 위험/g,"위험")
     .replace(/\.\s*\./g,".")
     .replace(/\s+([,.])/g,"$1")
     .replace(/[.]+$/,"");
  s=shortenSentence(s,max);
  return s+".";
}
function naturalHazardSentence(v){
  let s=stripArrows(v).replace(/\n/g," ").replace(/[.]+$/,"").trim()
    .replace(/작업자가\s*/g,"").replace(/작업\s*중\s*/g,"").replace(/\s{2,}/g," ");
  if(!s)return "";
  if(!/(우려가 있다|위험이 있다|발생할 수 있다|가능성이 있다)$/.test(s))s+=" 위험이 있다";
  return shortenSentence(s,54)+".";
}


function conciseWhatText(tradeName,r,idx=0){
  const work=cleanLegacyNoise(String(r?.work||"")).replace(/[.\n]/g," ").trim();
  const hz=cleanLegacyNoise(String(r?.hazard||"")).replace(/[.\n]/g," ").trim();
  const a=`${tradeName} ${work} ${hz}`.toLowerCase();
  let s="";
  if(tradeName==="준공청소"){
    if(/세정제|약품|증기|혼합/.test(a)) s="세정제 사용 및 오염 제거 작업";
    else if(/젖은|미끄|습식|바닥/.test(a)) s="바닥 습식청소 및 건조 작업";
    else if(/스크레이|칼날|유리.*오염/.test(a)) s="유리·바닥 오염물 제거 작업";
    else if(/상부|사다리|작업대|추락/.test(a)) s="상부 마감재 청소 작업";
    else if(/폐기물|보양|반출/.test(a)) s="보양재 철거 및 폐기물 반출 작업";
    else s=idx%2===0?"마감재 세정 및 오염 제거 작업":"보양재 철거 및 최종 청소 작업";
  }else if(/천장.*(철거|해체)/.test(a)) s="천장재 해체 작업";
  else if(/바닥.*타일.*(브레이커|파쇄|철거)|브레이커/.test(a)) s="바닥타일 브레이커 파쇄 작업";
  else if(/벽체.*(철거|해체)/.test(a)) s="벽체 해체 작업";
  else if(/파이프머신|배관.*나사/.test(a)) s="배관 절단 및 나사 가공 작업";
  else if(/위생기구|세면대|대변기|수전/.test(a)) s="위생기구 설치 및 배관 연결 작업";
  else if(/케이블|전선.*포설/.test(a)) s="전선 및 케이블 포설 작업";
  else if(/분전반|결선/.test(a)) s="분전반 설치 및 결선 작업";
  else if(/그라인더|절단석/.test(a)) s="금속부재 그라인더 절단 작업";
  else if(/용접|브레이징/.test(a)) s="금속부재 용접 작업";
  else if(/사다리/.test(a)) s="사다리 사용 상부 작업";
  else if(/비계/.test(a)) s="이동식비계 사용 작업";
  else if(/고소작업대/.test(a)) s="고소작업대 사용 작업";
  else{
    s=naturalWorkSentence(work).replace(/[.]+$/,"");
    s=s.replace(/ 작업 작업$/," 작업");
  }
  s=s.replace(/\s+/g," ").trim();
  return shortenSentence(s,38).replace(/[.]+$/,"")+".";
}


function compactAccidentType(v,hazard=""){
  const src=`${String(v||"")} ${String(hazard||"")}`.replace(/\s+/g," ").trim();
  const out=[];
  const add=x=>{if(x&&!out.includes(x))out.push(x);};
  if(/감전|누전|전기/.test(src)) add("감전");
  if(/추락|떨어/.test(src)) add("추락");
  if(/낙하|맞음|비래/.test(src)) add("낙하·맞음");
  if(/협착|끼임|말림/.test(src)) add("협착·끼임");
  if(/충돌|부딪/.test(src)) add("충돌");
  if(/전도|넘어짐|미끄/.test(src)) add("전도·넘어짐");
  if(/절단|베임|찔림/.test(src)) add("베임·절단");
  if(/화재|화상|불티/.test(src)) add("화재·화상");
  if(/질식|중독|증기|분진/.test(src)) add("질식·중독");
  if(/붕괴|매몰/.test(src)) add("붕괴·매몰");
  if(/피부|안구|자극/.test(src)) add("피부·안구 자극");
  if(/근골격|요통|중량물/.test(src)) add("근골격계 부담");
  if(!out.length){
    const clean=String(v||"").replace(/[.\n]/g," ").replace(/\s+/g," ").trim();
    return shortenSentence(clean||"상해",18).replace(/[.]+$/,"");
  }
  return out.slice(0,2).join("·");
}
function compactCauseText(v,hazard=""){
  let s=cleanLegacyNoise(String(v||hazard||""))
    .replace(/\n/g," ")
    .replace(/으로 인하여|로 인하여|으로 인해|로 인해/g,"로")
    .replace(/발생할 수 있음|발생 가능/g,"")
    .replace(/\s+/g," ").trim();
  if(!s) s="작업순서 및 안전조치 미준수";
  /* 원인 핵심 1~2개만 남겨 칸 밖으로 넘지 않게 함 */
  const parts=s.split(/[,.]| 및 |·/).map(x=>x.trim()).filter(Boolean);
  s=(parts.slice(0,2).join("·")||s).trim();
  return shortenSentence(s,38).replace(/[.]+$/,"")+".";
}

function detailedMethod(r){
  const work=cleanLegacyNoise(String(r.work||"")).replace(/[.\n]/g," ").trim();
  const tools=cleanLegacyNoise(String(r.tools||"")).replace(/[.\n]/g," ").trim();
  const a=`${work} ${tools}`.toLowerCase();
  let core="";
  if(/철거|해체|파쇄|브레이커/.test(a)) core="철거계획서와 해체순서를 검토하고 철거 대상의 고정상태, 잔존 설비 및 낙하 가능 부위를 직접 조사하여 위험요인을 발굴한다";

  else if(/용접|브레이징|토치|화기/.test(a)) core="화기작업 체크리스트를 활용하여 가연물, 불티 비산범위, 용접기 및 가스호스 상태를 확인하고 화재 위험요인을 발굴한다";

    const judged=buildJudgedFollowups(t.name,item,item.work,item.tools,idx);
    const fresh=rowSpecificTexts(t.name,item.work,item.tools,item.hazard,item.why,item.how,idx+17);

    const candidates={
      method:[judged.method,fresh.method,`현장순회점검으로 ${compactWorkContext(item.work)} 상태와 ${item.hazard} 위험을 확인`],
      measure:[judged.measure,fresh.measure,`"${compactWorkContext(item.work)}" 작업 전 ${item.hazard} 발생요인을 제거하고 해당 작업 완료 후 조치상태 확인`],
      technicalReview:[judged.tech,fresh.tech,`"${compactWorkContext(item.work)}"에 사용하는 ${item.tools}의 방호·고정·정격조건을 작업 전 확인`],
      managementReview:[judged.admin,fresh.admin,`"${compactWorkContext(item.work)}" 담당자·작업순서·통제범위를 지정하고 완료 전 이행상태 확인`]
    };
    ["method","measure","technicalReview","managementReview"].forEach(k=>{
      let chosen="";
      for(const c of candidates[k]){
        const compact=boxText(c,k==="method"?78:116,k==="method"?2:3);
        const sig=normalizeForDup(compact);
        if(compact && !used[k].has(sig)){chosen=compact;used[k].add(sig);break;}
      }
      if(!chosen){
        // 최후에도 같은 문구를 재사용하지 않고 해당 행 작업단계/위험을 조합해 새 문장 작성
        const tail=k==="method"
          ?`${compactWorkContext(item.work)} 작업상태 직접 확인`
          :k==="measure"
          ?`${compactWorkContext(item.work)} 단계의 ${item.hazard} 원인을 제거한 뒤 작업반장이 완료 확인`
          :k==="technicalReview"
          ?`${item.tools} 사용조건과 ${compactWorkContext(item.work)} 고정·방호상태를 기술적으로 확인`
          :`${compactWorkContext(item.work)} 작업순서와 통제구역을 지정하고 ${item.hazard} 재발 여부 확인`;
        chosen=boxText(tail,k==="method"?78:116,k==="method"?2:3);
        used[k].add(normalizeForDup(chosen));
      }
      r[k]=chosen;
    });
    r.work=naturalWorkSentence(cleanLegacyNoise(item.work));
    r.tools=boxText(stripArrows(cleanLegacyNoise(item.tools)),68,2);
    r.hazard=conciseHazard(cleanLegacyNoise(item.hazard));
    r.why=boxText(stripArrows(item.why),72,2);
    r.how=boxText(stripArrows(item.how),54,2);
    // v6.4: 공정 라이브러리에서 검토 완료한 발굴방법·감소대책·기술/관리 검토를 최우선 유지
    if(!manual.method) r.method=polishSentence(judged.method||detailedMethod(r),96);
    if(!manual.measure) r.measure=polishSentence(judged.measure||taskSpecificMeasure(r),148);
    if(!manual.technicalReview) r.technicalReview=polishSentence(judged.tech||detailedTech(r),118);
    if(!manual.managementReview) r.managementReview=polishSentence(judged.admin||detailedAdmin(r),118);
    r.hazard=polishSentence(r.hazard,54);
    if(!manual.what) r.what=conciseWhatText(t.name,r,idx);
    Object.keys(manualValues).forEach(k=>{r[k]=manualValues[k];});
    r._manual=manual;
  });
  return risks;
}

function getTradeRiskPool(tradeName){
  const studied=(TRADE_DEEP_STUDY[tradeName]||[]).map(x=>({...x}));
  const legacy=(RISK_KNOWLEDGE[tradeName]||[]).map(x=>({...x}));
  const all=studied.length ? [...studied,...legacy] : legacy;
  const seen=new Set();
  return all.filter(x=>{
    const k=(x.hazard||"").replace(/\s+/g," ").trim();
    if(!k||seen.has(k)) return false;
    seen.add(k); return true;
  });
}
function rotateRiskPool(pool,seed){
  if(!pool.length) return pool;
  let n=0; for(const ch of String(seed||"")) n=(n*31+ch.charCodeAt(0))>>>0;
  const shift=n%pool.length;
  return pool.slice(shift).concat(pool.slice(0,shift));
}

function inferGrades(item){
  const h=((item.hazard||"")+" "+(item.why||"")+" "+(item.how||"")).toLowerCase();
  let f=2,s=2;

  if(/상시|반복|빈번|매일|지속|통행|회전반경|동시작업/.test(h)) f=3;
  else if(/간헐|일시|점검|마감|청소/.test(h)) f=1;

  if(/추락|감전|붕괴|매몰|폭발|질식|대형 낙하|중량물|양중|화재/.test(h)) s=3;
  else if(/베임|찔림|전도|충돌|협착|분진|근골격|화상|안구/.test(h)) s=2;
  else s=1;

  const before=f*s;
  const beforeLevel=before>=6?"상":before>=3?"중":"하";

  const af=Math.max(1,f-1);
  const after=af*s;
  const afterLevel=after>=6?"상":after>=3?"중":"하";

  return {before:beforeLevel,after:afterLevel};
}

function diversifyRiskRowByItem(r,tradeName,item,idx){
 const hz=String(item?.hazard||r.hazard||"").trim(), why=String(item?.why||r.why||hz).trim(), how=String(item?.how||r.how||"").trim();
 const x=rowSpecificTexts(tradeName,String(r.work||""),String(r.tools||""),hz,why,how,idx);
 r.hazard=hz||r.hazard;
 r.method=x.method;
 r.measure=x.measure;

 r.managementReview=x.admin;
 const key=(hz+" "+why+" "+how+" "+String(r.work||"")).toLowerCase();
 if(/감전|화재|붕괴|추락|낙하|양중|폭발/.test(key)){r.grade="상";r.finalGrade="중";}

 return r;
}


function compactWorkContext(work){
  const s=String(work||"").replace(/^[^/]+\/\s*/,"").trim();
  const steps=s.split("→").map(x=>x.trim()).filter(Boolean);
  return (steps.slice(0,3).join(" → ")||s||"해당 세부작업").slice(0,92);
}
function findKnowledgeItem(tradeName,r,idx){
  const pool=getTradeRiskPool(tradeName);
  if(!pool.length)return null;
  const hz=String(r?.hazard||"").replace(/\s+/g," ").trim();
  const wk=String(r?.work||"").replace(/\s+/g," ").trim();
  let exact=pool.find(x=>hz && String(x.hazard||"").replace(/\s+/g," ").trim()===hz);
  if(exact)return exact;
  if(wk){
    const words=wk.split(/[\/→·,\s]+/).filter(x=>x.length>=2);
    let best=null,score=-1;
    pool.forEach(x=>{
      const xw=String(x.work||"");
      const sc=words.reduce((n,w)=>n+(xw.includes(w)?1:0),0);
      if(sc>score){score=sc;best=x;}
    });
    if(score>=2)return best;
  }
  return pool[idx%pool.length]||null;
}
function buildJudgedFollowups(tradeName,item,work,tools,idx){
  const base=item||{};
  // 심층 조사자료에 이미 작업별로 작성된 후속조치가 있으면 그것을 최우선 사용한다.
  if(base.method&&base.measure&&base.technicalReview&&base.managementReview){
    return {
      method:String(base.method).trim(),
      measure:String(base.measure).trim(),
      tech:String(base.technicalReview).trim(),
      admin:String(base.managementReview).trim()
    };
  }
  // 구형 위험요인은 작업내용+장비+위험요인을 다시 판정하여 새 후속조치를 만든다.
  return rowSpecificTexts(tradeName,work,tools,base.hazard||"",base.why||"",base.how||"",idx);
}
function makeFollowupsRowUnique(r,tradeName,idx){
  return r;
}
function buildLocalRisk(tradeName, item, idx){
  const d=detailedWorkFor(tradeName,idx);
  const g=inferGrades(item);
  const work=(item.work&&String(item.work).trim())?item.work:d.work;
  const tools=(item.tools&&String(item.tools).trim())?item.tools:d.tools;
  const judged=buildJudgedFollowups(tradeName,item,work,tools,idx);
  const six=compactRiskSixW(tradeName,{...item,work,tools},idx);
  const r={
    id:"r"+Date.now()+Math.random().toString(16).slice(2),
    place:"현장/작업구역",
    work, tools,
    hazard:item.hazard||"",
    whoWhere:six.whoWhere,
    what:six.what,
    why:six.why,
    how:six.how,
    measureWho:six.measureWho,
    method:judged.method,
    grade:item.grade||g.before,
    finalGrade:item.finalGrade||g.after,
    measure:judged.measure,
    technicalReview:judged.tech,
    managementReview:judged.admin,
    executor:(state.trades.find(x=>x.name===tradeName)?.foremanName)||"",
    checker:state.fields.checkerName||""
  };
  return applySiteConditionsToLocalRisk(makeFollowupsRowUnique(r,tradeName,idx));
}
function normalizeAIResult(tradeName, arr){
  if(!Array.isArray(arr)) return [];
  return arr.slice(0,8).map((r,i)=>{

    const base={hazard:r.hazard||r.risk||"",why:r.why||r.cause||"",how:r.how||r.accidentType||""};
    const g=inferGrades(base);
    return {
      id:"r"+Date.now()+i+Math.random().toString(16).slice(2),
      place:"현장/작업구역",
      work:(r.work&&String(r.work).trim().length>12)?r.work:d.work,

      why:base.why||base.hazard,
      how:base.how||"충돌·협착·전도",
      method:(r.method&&String(r.method).trim().length>35&&String(r.method).trim()!=="현장점검")?r.method:discoveryText(i,tradeName,base),
      grade:g.before,

      technicalReview:(r.technicalReview&&String(r.technicalReview).trim().length>45)?r.technicalReview:techReview(base),
      managementReview:(r.managementReview&&String(r.managementReview).trim().length>45)?r.managementReview:adminReview(base),
      executor:r.executor||(state.trades.find(x=>x.name===tradeName)?.foremanName)||"",
      checker:state.fields.checkerName||""
    };
  }).filter(r=>r.hazard||r.why||r.measure);
}


function needsEnrichment(r){
  if(!r) return true;
  const badMethod=!r.method || r.method.trim()==="현장점검";
  const badGrade=!r.grade || ["중","보통","중간"].includes(String(r.grade).trim());
  const badFinal=!r.finalGrade || ["중","보통","중간"].includes(String(r.finalGrade).trim());
  const badTools=!r.tools || r.tools.trim().length<8;
  const badTech=!r.technicalReview || r.technicalReview.trim().length<10;
  const badAdmin=!r.managementReview || r.managementReview.trim().length<10;
  const badMeasure=!r.measure || r.measure.split(/\s*[·/]\s*/).filter(Boolean).length<3;
  const badWork=!r.work || r.work.trim()===r.trade || r.work.trim().length<10;
  return badMethod||badGrade||badFinal||badTools||badTech||badAdmin||badMeasure||badWork;
}

function cleanRiskLegacyFields(r){
  ["work","tools","hazard","whoWhere","what","why","how","measureWho","method","measure","technicalReview","managementReview"].forEach(k=>{
    if(r && typeof r[k]==="string") r[k]=cleanLegacyNoise(r[k]);
  });
  return r;
}

function enrichExistingRisk(t,r,idx){
 cleanRiskLegacyFields(r);
 const manual={...(r?._manual||{})};
 const manualValues={};
 Object.keys(manual).forEach(k=>{if(manual[k]) manualValues[k]=r[k];});
 const matched=findKnowledgeItem(t.name,r,idx)||{};
 const d=detailedWorkFor(t.name,idx);
 const item={
   ...matched,
   hazard:r?.hazard||matched.hazard||`${t.name} 작업 중 위험`,
   why:r?.why||matched.why||"작업조건 확인 미흡",
   how:r?.how||matched.how||"상해",
   work:(r?.work&&r.work.trim().length>8)?r.work:(matched.work||d.work),
   tools:(r?.tools&&r.tools.trim().length>5)?r.tools:(matched.tools||d.tools)
 };
 const g=inferGrades(item);
 const judged=buildJudgedFollowups(t.name,item,item.work,item.tools,idx);
 const six=compactRiskSixW(t.name,item,idx);
 const obj={...r,
   place:r?.place||"현장/작업구역",
   work:item.work,tools:item.tools,hazard:item.hazard,
   whoWhere:six.whoWhere,
   what:six.what,why:six.why,how:six.how,
   measureWho:six.measureWho,
   method:judged.method,grade:matched.grade||g.before,finalGrade:matched.finalGrade||g.after,
   measure:judged.measure,technicalReview:judged.tech,managementReview:judged.admin,
   executor:String(t.foremanName||"").trim()?t.foremanName:"",checker:state.fields.checkerName||"",
   _manual:manual
 };
 let finalObj=applySiteConditionsToLocalRisk(makeFollowupsRowUnique(obj,t.name,idx));
 Object.keys(manualValues).forEach(k=>{finalObj[k]=manualValues[k];});
 finalObj._manual=manual;
 return finalObj;
}
function sanitizeStoredText(v){
  return String(v??"")
    .replace(/\\n\s*\d*/gi," / ")
    .replace(/\s*\/\s*\/\s*/g," / ")
    .replace(/\s*·\s*·\s*/g," · ")
    .replace(/\s{2,}/g," ")
    .trim();
}
function sanitizeRiskObject(r){
  if(!r || typeof r!=="object") return r;
  Object.keys(r).forEach(k=>{
    if(typeof r[k]==="string") r[k]=sanitizeStoredText(r[k]);
  });
  return r;
}
function migrateAndEnrichTrades(){
  state.trades.forEach(t=>{
    if(typeof t.foremanName!=="string") t.foremanName="";
    if(!Array.isArray(t.risks)) t.risks=[];
    if(t.risks.length){
      t.risks=t.risks.map((r,i)=>enrichExistingRisk(t,sanitizeRiskObject(r),i));
    }
  });
}

function siteConditionHints(){
  const s=String(state.fields.siteConditions||"").trim();
  if(!s) return [];
  const out=[];
  if(/영업|고객|보행|통행/.test(s)) out.push("영업구역·고객/보행자 동선과 작업구역을 가설칸막이·바리케이드로 물리 분리하고 유도표지와 통제자를 배치");
  if(/야간|밤|심야/.test(s)) out.push("야간작업 조도를 사전 확인하고 그림자·눈부심이 없는 임시조명과 비상조명을 확보");
  if(/천장고|고소|높이|비계|사다리/.test(s)) out.push("작업높이에 맞는 작업발판·이동식비계·고소작업대를 선정하고 안전난간·아웃트리거·추락방지 조치를 적용");
  if(/협소|좁|밀폐/.test(s)) out.push("협소 작업구역의 통로폭·대피동선·환기상태를 확보하고 자재 적치량과 동시작업 인원을 제한");
  if(/우천|비|외부|옥외/.test(s)) out.push("강우·바탕면 수분·미끄럼·전기기기 방수상태를 확인하고 기상 악화 시 작업을 중지");
  if(/간섭|기존설비|배관|전선|케이블/.test(s)) out.push("기존 배관·전선·설비 위치를 도면과 현장에서 대조하고 탐지·표시 후 간섭구간 작업순서를 조정");
  if(/동시작업|혼재/.test(s)) out.push("동시작업 공정 간 작업시간·구역을 분리하고 공정책임자 간 사전협의와 작업허가를 실시");
  if(/화기|용접|절단|불티/.test(s)) out.push("화기작업허가, 방화포, 소화기, 가연물 이격, 화재감시자 및 종료 후 잔불확인을 적용");
  return out;
}
function applySiteConditionsToLocalRisk(r){
  const s=String(state.fields.siteConditions||"").trim();
  if(!s) return r;
  const hints=siteConditionHints();
  if(!hints.length){
    r.method=`${r.method} /  "${s}"을 작업 전 TBM 및 순회점검에서 실제 작업구역과 대조 확인`;
    r.managementReview=`${r.managementReview} /  "${s}" 변경 여부를 작업 전·중 확인하고 조건이 달라지면 작업을 중지한 뒤 재평가한다.`;
    return r;
  }
  const suffix=hints.join(" · ");
  r.hazard=`${r.hazard} / (${s})에 따른 추가 노출 가능성`;
  r.method=`${r.method} /  확인: ${s}`;
  r.measure=`${r.measure} · ${suffix}`;
  r.technicalReview=`${r.technicalReview} / ${hints.slice(0,2).join(" · ")}`;
  r.managementReview=`${r.managementReview} / ${hints.slice(2).concat(hints.slice(0,1)).join(" · ")}`;
  return r;
}
async function generateTradeAI(t,renderAfter=true){
  if(!t) return;
  const badge=$id("syncBadge"); if(badge) badge.textContent=`공정자료 적용 중: ${t.name}`;
  try{
    let base=getTradeRiskPool(t.name);
    if(!base.length) base=[
      {hazard:`${t.name} 작업 중 작업순서 미준수 및 주변 간섭으로 인한 사고`,why:"작업 전 위험요인 확인 및 작업구역 구획 미흡",how:"충돌·협착·전도"},
      {hazard:`${t.name} 작업 중 공구·자재 취급 부주의로 인한 사고`,why:"공구 사전점검과 자재 취급계획 미흡",how:"베임·낙하·충돌"}
    ];
    const studied=TRADE_DEEP_STUDY[t.name]||[];
    if(studied.length){ base=[...studied,...base.filter(x=>!studied.some(s=>s.hazard===x.hazard))]; }
    else { base=rotateRiskPool(base,new Date().toISOString().slice(0,10)+"-"+Math.random()); }
    t.risks=base.slice(0,2).map((item,i)=>buildLocalRisk(t.name,item,i));
    markDirty();
    if(renderAfter)renderAll();
    $id("syncBadge") && ($id("syncBadge").textContent=`공정자료 적용 완료: ${t.name}`);
    $id("syncBadge") && ($id("syncBadge").className="hidden");
  }catch(e){
    console.error(e);
    $id("syncBadge") && ($id("syncBadge").textContent="공정자료 오류");
    $id("syncBadge") && ($id("syncBadge").className="hidden");
    alert("자동작성 중 오류가 발생했습니다.\n\n"+e.message);
  }
}
async function generateAIForSelected(){
  const trs=selectedTrades();
  for(const t of trs){
    // 기존 구버전 데이터가 있어도 새 상세 로직으로 다시 작성
    t.risks=[];
    await generateTradeAI(t,false);
    t.risks=(t.risks||[]).map((r,i)=>enrichExistingRisk(t,r,i));
  }
  markDirty(); renderAll();
  alert(`${trs.length}개 공정의 상세 위험성평가를 새 기준으로 다시 작성했습니다.`);
}

async function generateAIForAll(){
  for(const t of state.trades){
    t.risks=[];
    await generateTradeAI(t,false);
    t.risks=(t.risks||[]).map((r,i)=>enrichExistingRisk(t,r,i));
  }
  markDirty(); renderAll();
  alert(`${state.trades.length}개 전체 공정의 상세 위험성평가를 새 기준으로 다시 작성했습니다.`);
}

function markDirty(){
  dirty=true;
  if(parent!==window) parent.dispatchEvent(new CustomEvent('minworks:risk-input'));
  clearTimeout(saveTimer);
  saveTimer=setTimeout(saveNow,1200);
}
function snapshot(){
 captureFields();
 return JSON.parse(JSON.stringify(state));
}

 localStorage.setItem("riskAssessmentSharedHtml",JSON.stringify(state));
 state.lastSavedAt=new Date().toISOString();
 dirty=false;updateStatus("브라우저에 저장됨");

  if(badge)badge.className="hidden";

 captureFields();

}

(async function init(){
 const raw=localStorage.getItem("riskAssessmentSharedHtml");
 let loadedSchema=40;
 if(raw){
   try{state=JSON.parse(raw);loadedSchema=Number(state.schemaVersion||0)}catch(e){}
 }
 if(!state.trades?.length){
  state.trades=BASE_TRADES.map((name,i)=>({id:"t"+(i+1),name,selected:false,foremanName:"",risks:[]}));
 }else{
  // 버전 업데이트 시 새 공정이 기존 브라우저 저장 데이터 때문에 누락되지 않도록 자동 병합
  const existingNames=new Set(state.trades.map(t=>t.name));
  BASE_TRADES.forEach(name=>{
    if(!existingNames.has(name)){
      state.trades.push({id:"t"+Date.now()+Math.random().toString(16).slice(2),name,selected:false,foremanName:"",risks:[]});
    }
  });
 }
 // v7.0에서 제외한 공정은 기존 저장 데이터에서도 제거
 state.trades=state.trades.filter(t=>BASE_TRADES.includes(t.name));
 if(!state.fields)state.fields={};
 // v6.7: 기존 문서의 점검담당자 기본값(임수범)을 좌측 설정과 연동.
 // 이번 버전 첫 진입에서만 기본값을 넣고 이후 사용자 수정값은 그대로 보존한다.
 if(loadedSchema<45 && !String(state.fields.checkerName||"").trim()) state.fields.checkerName="임수범";
 // v6 최초 진입 시 기존 1~전체공정 자동선택 상태만 해제한다.
 if(loadedSchema<40) state.trades.forEach(t=>t.selected=false);
 // v7.0 단일HTML 전공정 위험성평가 재작성:
 // 공사명·담당자·공정선택·작업반장 등 사용자가 설정한 값은 보존하고,
 // 위험항목만 새 공정 라이브러리 기준으로 한 번 재구성한다.
 if(loadedSchema<47) state.trades.forEach(t=>{t.risks=[];});

 // v8.2 분류/회사명/자동 개정 마이그레이션
 state.trades=state.trades.filter(t=>t.name!=="지장물조사");
 state.trades.forEach(t=>{t.category=TRADE_CATEGORY_BY_NAME[t.name]||t.category||"인테리어";});
 state.fields.companyName=normalizeCompanyName(state.fields.companyName)||"(주)민커뮤니케이션";
 updateRevisionFromWriteDate(state.fields.writeDate||"");

 state.schemaVersion=73;
 migrateAndEnrichTrades();
 restoreFields();bindInputs();renderAll();
 setTimeout(async()=>{
   for(const t of selectedTrades()){
     if(!t.risks?.length){
       const base=getTradeRiskPool(t.name).length?getTradeRiskPool(t.name):[
         {hazard:`${t.name} 작업 중 장비·공구 및 자재 취급에 따른 위험`,why:"세부작업별 안전조치 및 작업구역 관리 미흡",how:"충돌·협착·전도"},
         {hazard:`${t.name} 작업 중 작업발판·통로·동시작업 간섭에 따른 위험`,why:"작업동선 및 작업순서 관리 미흡",how:"추락·충돌·낙하"}
       ];
       t.risks=base.slice(0,2).map((item,i)=>buildLocalRisk(t.name,item,i));
     }else{
       t.risks=t.risks.map((r,i)=>enrichExistingRisk(t,sanitizeRiskObject(r),i));
     }
   }
   markDirty(); renderAll();
 },150);
})();

</script>
