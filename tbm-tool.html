<!DOCTYPE html>

<head>

<title>TBM 회의록 v2.3 - 오늘 날짜 자동 표시 · 후수정 가능</title>
<style>
:root{--line:#111;--head:#e7e7e7;--ui:#f4f6f8;--accent:#3159a6;}
*{box-sizing:border-box}
body{margin:0;background:#eef1f4;font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;color:#111}
.toolbar{max-width:1120px;margin:14px auto;background:#fff;border:1px solid #d7dce2;border-radius:10px;padding:14px 16px;box-shadow:0 2px 10px #0000000d}
.toolbar h2{margin:0 0 10px;font-size:18px}
.controls{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.control{border:1px solid #d5d9df;border-radius:7px;padding:9px;background:#fff}
.control label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
.control input{width:100%;height:36px;border:1px solid #bfc5cc;border-radius:5px;padding:0 9px;font-size:14px}
.datetime{display:flex;gap:6px}
.datetime input{min-width:0}
.weather-picks{display:flex;gap:6px;flex-wrap:wrap}
.weather-btn{width:58px;height:52px;border:1px solid #cfd4db;background:white;border-radius:8px;cursor:pointer;padding:3px;font-size:11px}
.weather-btn.selected{outline:2px solid var(--accent);background:#eef4ff}

.time-wrap{display:flex;gap:4px;min-width:0;flex:1}.time-wrap input{min-width:0}
.weather-btn svg{display:block;margin:auto;width:28px;height:28px}
.process-box{margin-top:12px;border-top:1px solid #ddd;padding-top:12px}
.process-grid{display:flex;gap:6px;flex-wrap:wrap;max-height:150px;overflow:auto;padding:2px}
.process-btn{border:1px solid #bcc4cf;background:#fff;border-radius:16px;padding:6px 10px;cursor:pointer;font-size:12px}
.process-btn.selected{background:#263f76;color:#fff;border-color:#263f76}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{border:0;border-radius:6px;padding:9px 15px;cursor:pointer;font-weight:700}
.primary{background:#253d70;color:#fff} .secondary{background:#e5e8ec;color:#222}
.hint{font-size:12px;color:#5c6470;margin-top:7px}
.sheet{width:1050px;min-height:1485px;margin:15px auto 40px;background:#fff;padding:24px 30px;box-shadow:0 3px 20px #0002}
.tbm{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px}
.tbm td,.tbm th{border:1.3px solid #111;padding:6px;vertical-align:middle}
.title{height:150px;font-size:35px;font-weight:800;text-align:center}
.label{font-weight:700;text-align:center;background:#fafafa}
.info-row{height:56px}
.date-display{text-align:center;font-size:15px}
.weather-display{text-align:center;font-weight:700}
.section-title{background:var(--head);font-size:16px;font-weight:800;height:40px}
.content-cell{height:500px;vertical-align:top!important;padding:14px 16px!important;line-height:1.55}
.content-empty{color:#888;text-align:center;margin-top:80px}
.tbm-item{margin-bottom:15px;padding-bottom:12px;border-bottom:1px dashed #bbb}
.tbm-item:last-child{border-bottom:none}
.tbm-item .work-title{font-weight:800;font-size:15px;margin-bottom:5px}
.tbm-item .line{margin:3px 0}
.work-extra-input{width:100%;min-height:48px;border:1px solid #c8cdd4;border-radius:5px;padding:7px 8px;font:inherit;resize:vertical;background:#fff}
.recognized{font-size:11px;color:#3159a6;margin:3px 0 6px}
@media print{.work-extra-input{border:0;padding:0;min-height:24px;resize:none}}
.attend-title{background:var(--head);font-weight:800;height:38px}
.attend-head{background:#f6f6f6;text-align:center;font-weight:700;height:38px}
.att-row td{height:42px;text-align:center}
.name-input{width:100%;border:0;outline:none;text-align:center;font:inherit;background:transparent}
.remark-title{background:var(--head);font-weight:800;height:38px}
.remark-cell{height:90px;vertical-align:top!important}
.remark-input{width:100%;height:72px;border:0;outline:none;resize:none;font:inherit}
.sign-blank{background:#fff}
@media(max-width:1100px){.sheet{transform-origin:top left;width:1050px;margin-left:10px}.controls{grid-template-columns:1fr 1fr}}
@media print{
 body{background:#fff}
 .toolbar{display:none!important}
 .sheet{margin:0;box-shadow:none;width:100%;min-height:auto;padding:8mm}
 @page{size:A4 portrait;margin:6mm}
 .tbm{font-size:11px}
 .title{height:37mm;font-size:28px}
 .content-cell{height:105mm}
 .att-row td{height:8.5mm}
 .remark-cell{height:17mm}
}

/* v1.8 — 위험성평가 최종본과 동일 계열의 MIN WORKS UI
   실제 TBM 서류(.sheet/.tbm) 구조는 변경하지 않는다. */
:root{
  --ui-ink:#151619;
  --ui-muted:#9ea2a9;
  --ui-line:#303238;
  --ui-lime:#8bd20a;
  --ui-paper:#fff;
}
body{background:linear-gradient(135deg,#f8f9fa,#eff1f4)!important}
.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:320px minmax(0,1fr);
}
.workspace{min-width:0;padding-bottom:60px}

/* 상단 저장/출력 */
.ui-actionbar{
  position:sticky;
  top:0;
  z-index:30;
  min-height:58px;
  padding:10px 18px;
  background:#fff;
  border-bottom:1px solid #e2e5e9;
  box-shadow:0 5px 18px rgba(22,25,30,.06);
  display:flex;
  align-items:center;
  gap:12px;
}
.ui-action-brand{
  display:flex;align-items:center;gap:9px;margin-right:auto;
  color:var(--ui-ink);font-size:12px;font-weight:900;letter-spacing:.12em;
}
.ui-mark{
  display:grid;place-items:center;width:32px;height:32px;border-radius:9px;
  background:var(--ui-lime);color:#101308;font-size:16px;font-weight:900;letter-spacing:0;
}
.ui-actions{display:flex;gap:8px;align-items:center}
.ui-action{
  height:38px;padding:0 15px;border-radius:10px;font-size:11.5px;
  font-weight:800;cursor:pointer
}
.ui-save{border:1px solid var(--ui-ink);background:var(--ui-ink);color:#fff}
.ui-save:hover{filter:brightness(1.08)}
.ui-print{border:1px solid #dfe2e6;background:#fff;color:#383b40}
.ui-print:hover{border-color:#aeb4bc;background:#fafbfc}

/* 왼쪽 설정 */
.toolbar.ui-settings{
  position:sticky!important;
  top:0!important;
  align-self:start!important;
  width:auto!important;
  max-width:none!important;
  height:100vh!important;
  margin:0!important;
  padding:20px 18px!important;
  overflow:auto!important;
  border:0!important;
  border-radius:0!important;
  background:var(--ui-ink)!important;
  color:#fff!important;
  box-shadow:none!important;
}
.ui-setting-block{margin:0 0 16px}
.ui-section-label{
  display:block;margin:0 0 9px;color:#fff;font-size:13px;
  line-height:1.3;font-weight:800;
}
.ui-field{display:grid;gap:6px;margin-bottom:9px}
.ui-field>span{font-size:10px;font-weight:800;color:#b7bbc1}
.toolbar.ui-settings input{
  width:100%;min-height:40px;border:1px solid #34373c;border-radius:10px;
  background:#1c1e22;color:#fff;padding:8px 10px;outline:none;font-size:12px;
}
.toolbar.ui-settings input:focus{
  border-color:var(--ui-lime);box-shadow:0 0 0 3px rgba(139,210,10,.14)
}
.toolbar.ui-settings input::placeholder{color:#777d85}
.datetime{display:flex;gap:6px}
.time-wrap{min-width:0;flex:1}

.weather-picks{
  display:grid!important;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:6px!important;
  flex-wrap:nowrap!important;
}
.weather-btn{
  width:100%!important;height:52px!important;border:1px solid #34373c!important;
  background:#1c1e22!important;color:#d5d8dd!important;border-radius:10px!important;
  cursor:pointer;padding:3px!important;font-size:10px!important
}
.weather-btn:hover{border-color:var(--ui-lime)!important;color:#fff!important}
.weather-btn.selected{
  outline:0!important;background:var(--ui-lime)!important;color:#101308!important;
  border-color:var(--ui-lime)!important;font-weight:800
}
.weather-btn svg{display:block;margin:auto;width:25px;height:25px}

.trade-section-label{margin-top:18px}
.process-categories{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin:0 0 10px
}
.process-category{
  min-height:38px;border:1px solid #34373c;border-radius:10px;
  background:#1c1e22;color:#d5d8dd;font-size:12px;font-weight:800;cursor:pointer
}
.process-category:hover{border-color:var(--ui-lime);color:#fff;background:#22252a}
.process-category.active{
  border-color:var(--ui-lime);background:var(--ui-lime);color:#101308
}
.process-grid{
  display:grid!important;
  gap:6px!important;
  max-height:310px!important;
  overflow:auto!important;
  padding:2px!important;
  margin:0!important;
}
.process-row{
  display:grid;grid-template-columns:20px minmax(0,1fr);align-items:center;gap:8px;
  min-height:38px;padding:6px 9px;border:1px solid #303238;border-radius:10px;
  background:#1c1e22;color:#f1f3f5;cursor:pointer
}
.process-row:hover{border-color:#5a615f;background:#22252a}
.process-row.selected{background:#222827;border-color:#536044}
.process-row input{width:16px!important;height:16px!important;min-height:0!important;padding:0!important;accent-color:var(--ui-lime)}
.process-name{font-size:11.5px;font-weight:750;line-height:1.25}
.process-empty{
  padding:12px;border:1px dashed #3b3e43;border-radius:10px;
  background:#1c1e22;color:#aeb2b8;text-align:center;font-size:11px
}
.ui-status{
  min-height:18px;margin-top:10px;color:#aeb2b8;font-size:10px;line-height:1.45
}

/* 문서는 기존 구조 유지. 작업공간에서 중앙 정렬만 함 */
.workspace>.sheet{margin-left:auto!important;margin-right:auto!important}

/* 작은 화면 */
@media(max-width:1000px){
  .app{grid-template-columns:1fr}
  .toolbar.ui-settings{position:relative!important;height:auto!important;max-height:none!important}
  .ui-actionbar{position:sticky}
}

/* A4 세로 출력 최적화 */
@media print{
  *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .toolbar.ui-settings,.ui-actionbar{display:none!important}
  .app{display:block!important}
  .workspace{padding:0!important}
  body{background:#fff!important;margin:0!important}
  @page{size:A4 portrait;margin:6mm}

  .sheet{
    width:198mm!important;
    min-height:0!important;
    margin:0!important;
    padding:0!important;
    box-shadow:none!important;
  }
  .tbm{width:100%!important;font-size:10.2px!important}
  .tbm td,.tbm th{padding:1.8mm!important}
  .title{height:24mm!important;font-size:25px!important}
  .info-row{height:9mm!important}
  .date-display{font-size:10.5px!important}
  .weather-display{font-size:10.5px!important}
  .section-title{height:7.5mm!important;font-size:11.5px!important}
  .content-cell{
    height:75mm!important;
    max-height:75mm!important;
    padding:3mm 4mm!important;
    line-height:1.32!important;
    overflow:hidden!important;
  }
  .tbm-item{margin-bottom:2.2mm!important;padding-bottom:1.7mm!important}
  .tbm-item .work-title{font-size:10.8px!important;margin-bottom:1mm!important}
  .tbm-item .line{margin:.7mm 0!important}
  .recognized{font-size:8.5px!important;margin:.6mm 0 1mm!important}
  .work-extra-input{
    border:0!important;padding:0!important;min-height:5mm!important;
    max-height:8mm!important;resize:none!important;font-size:9.7px!important
  }
  .attend-title{height:7mm!important}
  .attend-head{height:6.8mm!important}
  .att-row td{height:6mm!important;padding:1mm!important}
  .remark-title{height:7mm!important}
  .remark-cell{height:14mm!important}
  .remark-input{height:12mm!important}
}


/* v1.9: 서류 직접수정 + 공정별 내용 직접편집 + 합정동 날씨 자동 */
.weather-auto-note{
  padding:10px 11px;border:1px solid #303238;border-radius:10px;
  background:#1c1e22;color:#aeb2b8;font-size:10px;line-height:1.45;
}
.doc-direct-input{
  width:100%;height:100%;min-height:36px;border:0!important;outline:0!important;
  background:transparent!important;color:#111;font:inherit;padding:2px 4px;
}
.direct-datetime{
  display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,.9fr) auto minmax(0,.9fr);
  align-items:center;gap:4px;width:100%;
}
.direct-datetime input{
  width:100%;min-width:0;height:34px;border:0;outline:0;background:transparent;
  text-align:center;font:inherit;color:#111;padding:1px 2px;
}
.time-sep{font-weight:700;text-align:center}
.print-only{display:none}
.direct-date-cell{padding:3px 5px!important}

.tbm-edit-block{margin:3px 0}
.tbm-edit-label{font-weight:800;display:block;margin-bottom:2px}
.tbm-content-edit{
  width:100%;border:1px solid #c8cdd4;border-radius:5px;
  padding:6px 7px;font:inherit;line-height:1.4;resize:vertical;
  background:#fff;color:#111;min-height:38px;
}
.tbm-work-edit{min-height:40px}
.tbm-risk-edit,.tbm-prec-edit{min-height:58px}

@media print{
  .screen-edit{display:none!important}
  .print-only{display:block!important}
  .direct-datetime-print{
    text-align:center!important;font:inherit!important;color:#111!important;
    white-space:nowrap!important
  }
  .doc-direct-input{
    border:0!important;box-shadow:none!important;outline:0!important;
    background:transparent!important;color:#111!important;
    -webkit-appearance:none!important;appearance:none!important;padding:0!important
  }
  input[type="date"],input[type="time"]{
    -webkit-appearance:none!important;appearance:none!important;background-image:none!important
  }
  input[type="date"]::-webkit-calendar-picker-indicator,
  input[type="time"]::-webkit-calendar-picker-indicator,
  input[type="date"]::-webkit-inner-spin-button,
  input[type="time"]::-webkit-inner-spin-button{
    display:none!important;-webkit-appearance:none!important
  }
  .tbm-content-edit{
    border:0!important;border-radius:0!important;padding:0!important;
    resize:none!important;background:transparent!important;color:#111!important;
    overflow:hidden!important
  }
  .tbm-work-edit{min-height:4.5mm!important}
  .tbm-risk-edit,.tbm-prec-edit{min-height:7mm!important}
}


/* v2.0: 직접 수정 중임을 직관적으로 표시 */
.sheet .direct-edit-box{
  transition:background .12s ease, box-shadow .12s ease, outline-color .12s ease;
  cursor:text;
}
.sheet .direct-edit-box:hover{
  background:#fffdf0!important;
  box-shadow:inset 0 0 0 1px #d4a600!important;
  border-radius:3px!important;
}
.sheet .direct-edit-box:focus{
  background:#fff9d9!important;
  box-shadow:inset 0 0 0 2px #d4a600!important;
  border-radius:3px!important;
  outline:none!important;
}

/* 날짜/시간도 수정할 때 같은 박스 효과 */
.direct-datetime .direct-edit-box{
  border:0!important;
}
.direct-datetime .direct-edit-box:hover,
.direct-datetime .direct-edit-box:focus{
  background:#fff9d9!important;
}

/* 좌측 검은 영역은 공정 선택 전용 */
.toolbar.ui-settings{
  padding-top:24px!important;
}
.toolbar.ui-settings .trade-section-label{
  margin-top:0!important;
}
.toolbar.ui-settings .process-grid{
  max-height:calc(100vh - 150px)!important;
}

/* 출력에는 수정 박스/포커스 표시 절대 노출 금지 */
@media print{
  .sheet .direct-edit-box,
  .sheet .direct-edit-box:hover,
  .sheet .direct-edit-box:focus{
    background:transparent!important;
    box-shadow:none!important;
    outline:none!important;
    border-radius:0!important;
  }
}


/* v2.1: TBM 장소 고정 선택형 */
.doc-place-select{
  width:100%!important;
  height:36px!important;
  min-height:36px!important;
  border:0!important;
  outline:0!important;
  background:transparent!important;
  color:#111!important;
  font:inherit!important;
  text-align:center!important;
  text-align-last:center!important;
  padding:2px 22px 2px 4px!important;
  cursor:pointer!important;
}
.doc-place-select option{
  color:#111;
  background:#fff;
}

/* PDF 출력 방향을 A4 세로로 강제 */
@page{
  size:210mm 297mm!important;
  margin:6mm!important;
}
@media print{
  html,body{
    width:210mm!important;
    min-width:210mm!important;

  }

/* v2.2: 참석자 영역 스마트 페이지 분리
   - 남은 공간에 전부 들어가면 같은 A4에 이어서 출력
   - 전부 들어가지 않으면 참석자+비고 블록 전체를 다음 A4로 이동 */
.tbm-attendance{
  margin-top:-1.3px; /* 화면에서는 원래 하나의 표처럼 연결 */
  break-inside:avoid;
  page-break-inside:avoid;
}

@media print{
  .tbm-attendance{
    width:198mm!important;
    min-width:198mm!important;
    max-width:198mm!important;
    margin-top:-1.3px!important;
    table-layout:fixed!important;

    /* 핵심: 참석자 블록을 중간에서 자르지 않음 */
    break-inside:avoid-page!important;
    page-break-inside:avoid!important;
  }

  /* 참석자 제목부터 비고까지 한 덩어리로 유지 */
  .tbm-attendance tr,
  .tbm-attendance tbody{
    break-inside:avoid!important;
    page-break-inside:avoid!important;
  }

  /* 브라우저가 표의 첫 행만 앞 페이지에 남기는 현상 방지 */
  .tbm-attendance .attend-title{
    break-after:avoid!important;
    page-break-after:avoid!important;
  }
}

function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function processLabel(name){
  if(name==="목공사") return "목공";
  if(name==="금속창호(커튼월)공사" || name==="금속창호/커튼월공사") return "커튼월";
  return String(name||"").replace(/공사$/,"");
}
function documentProcessLabel(name){
  const shortName=processLabel(name);

}

    ["docDateInput","dateInput"],

    ["docSiteNameInput","siteNameInput"],
    ["docCompanyInput","companyInput"],
    ["docPlaceInput","placeInput"]

    ["docCompanyInput","companyInput"],

function localTodayISO(){
  const now=new Date();
  const y=now.getFullYear();
  const m=String(now.getMonth()+1).padStart(2,"0");
  const d=String(now.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function fmtDate(v){
 if(!v)return "";
 const [y,m,d]=v.split("-");
 return `${y}년 ${Number(m)}월 ${Number(d)}일`;
}

function uniq(arr){return [...new Set(arr.map(v=>String(v).trim()).filter(Boolean))];}
function analyzeTypedWork(processName,typed){
 const base=PROCESS_DATA[processName];
 const text=(processName+" "+(typed||"")).toLowerCase();
 const matched=LOCAL_WORK_RULES.filter(rule=>rule.k.some(k=>text.includes(k.toLowerCase())));
 let risk=[],prec=[],words=[];
 matched.forEach(rule=>{
   risk.push(...rule.risk); prec.push(...rule.prec);
   words.push(...rule.k.filter(k=>text.includes(k.toLowerCase())));
 });
 if(!matched.length){risk=[...base.risk];prec=[...base.prec];}
 else{risk.push(base.risk[0]);prec.push(base.prec[0]);}
 return {risk:uniq(risk).slice(0,4),prec:uniq(prec).slice(0,4),matched:uniq(words)};
}

function detailForProcess(p){

 if(!customTbmDetails[p]){
   customTbmDetails[p]={
     work:base.work||"",
     risk:(base.risk||[]).join(" / "),
     prec:(base.prec||[]).join(" / ")
   };
 }
 return customTbmDetails[p];
}

function processMatchesQuery(p,query){
 return p.toLowerCase().includes(query)||processLabel(p).toLowerCase().includes(query);
}
function chooseProcessFromSearch(p){
 if(!p)return;
 toggleProcess(p);
 const input=document.getElementById('processSearch');
 input.value='';
 renderProcesses();
 input.focus();
}
function handleProcessSearchKey(event){
 if(event.key!=="Enter")return;
 const query=event.currentTarget.value.trim().toLowerCase();
 if(!query)return;
 const matches=TBM_ALL_PROCESSES.filter(p=>processMatchesQuery(p,query)&&!selectedProcesses.includes(p));
 const exact=matches.find(p=>processLabel(p).toLowerCase()===query);
 const target=exact||matches[0];
 if(target){event.preventDefault();chooseProcessFromSearch(target);}
}
function renderProcesses(){
 renderProcessCategories();
 const query=document.getElementById('processSearch').value.trim().toLowerCase();
 const matches=query?TBM_ALL_PROCESSES.filter(p=>processMatchesQuery(p,query)&&!selectedProcesses.includes(p)):[];
 const g=document.getElementById('processGrid');
 const button=p=>'<button type="button" class="process-row '+(selectedProcesses.includes(p)?'selected':'')+'" aria-pressed="'+selectedProcesses.includes(p)+'" data-process="'+esc(p)+'"><span class="process-name">'+esc(processLabel(p))+'</span><span aria-hidden="true">'+(selectedProcesses.includes(p)?'✓':'+')+'</span></button>';
 const shortMatches=matches.filter(p=>processLabel(p).length<=3);
 const longMatches=matches.filter(p=>processLabel(p).length>=4);
 g.innerHTML=(selectedProcesses.length?'<div class="process-group-label">선택한 공정</div><div class="process-button-row selected-processes">'+selectedProcesses.map(button).join('')+'</div>':'')+
   '<div class="process-group-label">'+(query?'자동완성 결과':'공정 자동완성')+'</div>'+
   (shortMatches.length?'<div class="process-button-row short-processes">'+shortMatches.map(button).join('')+'</div>':'')+
   (longMatches.length?'<div class="process-button-row long-processes">'+longMatches.map(button).join('')+'</div>':'')+
   (!query?'<div class="process-empty">공정명을 입력하면 관련 공정이 자동으로 표시됩니다.</div>':!matches.length?'<div class="process-empty">일치하는 공정이 없습니다. 다른 이름으로 입력해보세요.</div>':'');
 g.querySelectorAll('[data-process]').forEach(b=>b.onclick=()=>chooseProcessFromSearch(b.dataset.process));
 document.getElementById('processSelectionCount').textContent='선택 '+selectedProcesses.length+'개';
}
function toggleProcess(p,checked){
  const has=selectedProcesses.includes(p);
  if(checked===true && !has) selectedProcesses.push(p);
  else if(checked===false && has) selectedProcesses=selectedProcesses.filter(x=>x!==p);
  else if(checked==null){
    selectedProcesses=has?selectedProcesses.filter(x=>x!==p):[...selectedProcesses,p];
  }
  selectedProcesses=TBM_ALL_PROCESSES.filter(x=>selectedProcesses.includes(x));
  renderProcesses();
  renderHeader();
  renderContent();
  saveState();
}

const WEATHER_LOCATION="서울특별시 마포구 합정동";

function normalizeWeatherLabel(text){
 const s=String(text||"");
 if(/눈|snow/i.test(s))return "눈";
 if(/비|소나기|rain|shower/i.test(s))return "비";
 if(/흐림|구름|cloud|overcast/i.test(s))return "흐림";
 if(/바람|wind/i.test(s))return "바람";
 if(/맑음|화창|sunny|clear/i.test(s))return "맑음";
 return "";
}
function parseWeatherPage(html){
 const text=String(html||"")
   .replace(/<script[\s\S]*?<\/script>/gi," ")
   .replace(/<style[\s\S]*?<\/style>/gi," ")
   .replace(/<[^>]+>/g," ")
   .replace(/&nbsp;|&#160;/gi," ")
   .replace(/\s+/g," ").trim();
 const weather=normalizeWeatherLabel(text);
 const pats=[
   /현재\s*온도[^0-9-]*(-?\d+(?:\.\d+)?)\s*°?/i,
   /기온[^0-9-]*(-?\d+(?:\.\d+)?)\s*°?/i,
   /(-?\d+(?:\.\d+)?)\s*°C/i,
   /(-?\d+(?:\.\d+)?)\s*℃/
 ];
 let temp="";
 for(const p of pats){const m=text.match(p);if(m){temp=m[1];break;}}
 return (weather||temp)?{weather,temp}:null;
}
async function readPublicWeatherPage(url){
 const r=await fetch(url,{method:"GET",mode:"cors",credentials:"omit",cache:"no-store"});
 if(!r.ok)throw new Error("weather");
 return parseWeatherPage(await r.text());
}
async function autoUpdateWeatherNoApi(){
 if(!navigator.onLine)return false;
 const q=encodeURIComponent("서울 마포구 합정동 오늘 날씨 기온");
 const urls=[
   `https://search.naver.com/search.naver?query=${q}`,
   `https://www.google.com/search?q=${q}&hl=ko`
 ];
 for(const url of urls){
   try{
     const found=await readPublicWeatherPage(url);
     if(found&&(found.weather||found.temp)){
       if(found.weather)selectedWeather=found.weather;
       if(found.temp)document.getElementById("tempInput").value=found.temp;
       localStorage.setItem("SafetyV27:TBMWeatherV23",JSON.stringify({
         weather:selectedWeather,
         temp:document.getElementById("tempInput").value,
         at:Date.now()
       }));
       renderHeader();
       saveState();
       return true;
     }
   }catch(e){}
 }
 return false;
}
