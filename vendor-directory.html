<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>MIN WORKS | 협력업체 연락망</title>
  <style>
    @font-face{font-family:Pretendard;src:url(assets/PretendardVariable.woff2) format("woff2");font-style:normal;font-weight:100 900;font-display:swap}
    .nav.active:before{content:"";position:absolute;left:-1px;top:50%;transform:translateY(-50%);width:2px;height:21px;background:var(--lime);border-radius:2px}
    .ui-icon{display:block;width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
    .detail-actions .ui-icon{width:15px;height:15px}
    .actions button:hover,.detail-ops button:hover{border-color:#c9cdd4;background:#f7f8fa}
    .actions button.primary:hover{background:#2b2d31;border-color:#2b2d31}

    :root{--ink:#111214;--sub:#71757d;--line:#e2e4e8;--mint:#eaf7d4;--lime:#8bd20a;--bg:#f5f6f8;--white:#fff;--danger:#bc4545;--shadow:0 1px 2px rgba(17,18,20,.03),0 14px 36px rgba(17,18,20,.045)}
    *{box-sizing:border-box}
    html{font-family:Pretendard,Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);letter-spacing:-.015em;-webkit-font-smoothing:antialiased}
    body{margin:0;background:radial-gradient(circle at 70% -10%,rgba(120,105,255,.065),transparent 34rem),linear-gradient(180deg,#f9fafb 0,#f5f6f8 42%,#f3f4f6 100%)}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #8bd20a;outline-offset:2px}
    .shell{max-width:1920px;margin:auto;min-height:100vh;display:grid;grid-template-columns:196px minmax(0,1fr);background:transparent}
    .sidebar{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;background:rgba(249,250,251,.93);border-right:1px solid #e0e2e6;padding:22px 10px 18px}
    .brand{display:flex;gap:10px;align-items:center;min-height:68px;margin:0 4px 24px}
    .brand-mark{display:block;width:78px;height:auto;flex:none}
    .brand-name{font-weight:800;font-size:10px;letter-spacing:.16em;white-space:nowrap;color:#17181a}
    .brand-name small{display:block;color:#92969e;letter-spacing:.16em;font-size:9px;margin-top:3px}
    .sidebar-label{color:#a1a5ad;font-weight:800;font-size:9px;letter-spacing:.18em;margin:0 10px 12px}
    .nav{position:relative;display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 8px;border:1px solid transparent;border-radius:10px;color:#6f737a;font-size:12px;font-weight:650;margin-bottom:5px}
    .nav i{display:grid;place-items:center;font-style:normal;width:30px;height:30px;flex:none;border-radius:8px;background:transparent;color:#858991}
    .nav.active{background:#fff;color:#111214;border-color:#dfe1e5;box-shadow:0 1px 2px rgba(0,0,0,.04),0 5px 16px rgba(17,18,20,.035)}
    .nav.active i{color:#fff;background:#151619}
    .side-note{font-size:11px;color:#8c9097;margin: auto 5px 0;padding:16px 6px 0;border-top:1px solid #e0e2e6;line-height:1.7}
    .main{min-width:0;padding:42px 32px 28px}
    .top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:22px;flex-wrap:wrap}
    .eyebrow{margin:0 0 8px;color:#4d7600;font-size:11px;font-weight:800;letter-spacing:.16em}
    .top h1{font-size:32px;line-height:1.12;letter-spacing:-.055em;font-weight:750;margin:0 0 9px}
    .top p:last-child{margin:0;color:#8a8e95;font-size:12px;line-height:1.6}
    .actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
    .actions button,.ghost{border:1px solid #dfe2e6;background:#fff;border-radius:10px;padding:12px 14px;min-height:42px;color:#52565d;font-size:12px;font-weight:650;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.025)}
    .actions button.primary,.primary{background:#151619;color:#fff;border-color:#151619;box-shadow:0 1px 2px rgba(0,0,0,.13)}
    .statusbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:#8a8e95;font-size:11px;margin-bottom:18px}
    .statusbar b{background:#edf7dc;color:#4d7600;border-radius:6px;padding:5px 8px;font-weight:700}
    .statusbar .save-status{margin-left:auto}
    .workspace{display:grid;grid-template-columns:clamp(288px,24vw,352px) minmax(0,1fr);gap:16px;align-items:start}
    .panel{background:#fff;border:1px solid var(--line);border-radius:16px;min-width:0;box-shadow:var(--shadow)}
    .map-panel{padding:18px;display:flex;flex-direction:column;position:sticky;top:18px}
    .panel-header{display:flex;flex-direction:column;align-items:flex-start;gap:5px;margin-bottom:13px}
    .panel-header h2{font-size:18px;font-weight:700;margin:0;letter-spacing:-.035em}
    .panel-header small{color:#8a8e95;font-size:11px}
    .search{width:100%;min-width:0;height:44px;border:1px solid #dfe2e6;border-radius:10px;background:#fafbfc;padding:0 12px;font-size:13px;color:var(--ink)}
    .filter-row{display:flex;gap:7px;margin:11px 0 12px}
    .filter-row select,.filter-row button{border:1px solid #dfe2e6;background:#fff;border-radius:10px;min-height:40px;padding:9px 10px;font-size:12px;color:#62676f;font-weight:600}
    .filter-row select{flex:1;min-width:0}
    .filter-row button.active{background:#151619;color:#fff;border-color:#151619}
    .unlocated{border:1px solid #e2e4e8;background:#f7f8fa;border-radius:10px;color:#71757d;padding:10px 11px;text-align:left;font-size:12px;font-weight:600;margin-bottom:11px;min-height:40px}
    .unlocated.selected{background:#eaf7d4;color:#416600;border-color:#c8dda2}
    .map-area{position:relative;flex:none;width:100%;aspect-ratio:410/528;min-height:0;border:1px solid #edf0f2;border-radius:12px;background:radial-gradient(circle at 55% 34%,#fcfdfd,#f3f5f6);overflow:hidden}
    .map-svg{display:block;width:100%;height:100%}
    .country{fill:#edf1e8;stroke:#bbc6af;stroke-width:1.6;stroke-linejoin:round;vector-effect:non-scaling-stroke}
    .marker{cursor:pointer}
    .marker .halo{fill:#fff;stroke:#d5dec9;stroke-width:2.3}
    .marker .disc{fill:#8bd20a}
    .marker .value{font-size:14px;font-weight:800;text-anchor:middle;dominant-baseline:middle;fill:#28350f}
    .marker .label{font-size:14px;font-weight:800;fill:#646b60}
    .marker.active .halo{fill:var(--ink);stroke:var(--ink)}
    .marker.active .disc{fill:#b8e66e}
    .marker.active .value{fill:#28350f}
    .map-foot{display:flex;flex-direction:column;gap:5px;margin-top:12px;color:#8a8e95;font-size:10px;line-height:1.5}
    .info-panel{padding:20px;display:flex;flex-direction:column;min-height:0;container-type:inline-size}
    .area-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
    .area-heading span{color:#80b900;font-size:10px;letter-spacing:.15em;font-weight:800}
    .area-heading h2{font-size:25px;letter-spacing:-.045em;font-weight:700;margin:5px 0 4px}
    .area-heading p{font-size:12px;color:#8a8e95;margin:0}
    .count{background:#edf7dc;color:#4d7600;font-size:12px;font-weight:700;border-radius:8px;padding:8px 10px;white-space:nowrap}
    .list-tools{display:flex;gap:7px;margin:6px 0 12px;flex-wrap:wrap}
    .list-tools button{border:1px solid #dfe2e6;background:#fff;border-radius:10px;font-size:12px;min-height:38px;padding:8px 12px;color:#71757d;font-weight:600}
    .list-tools button.active{background:#151619;color:#fff;border-color:#151619}
    .vendor-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:80px;gap:8px;overflow:auto;align-content:start;height:352px;min-height:176px;padding:4px;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:#c9cdd4 transparent;overscroll-behavior:contain}
    .vendor-card{width:100%;min-width:0;text-align:left;border:1px solid #e2e4e8;background:#fff;border-radius:11px;padding:12px;color:var(--ink);display:grid;grid-template-columns:minmax(0,1fr) auto;align-content:center;gap:9px 6px}
    .vendor-card.selected{border-color:#c8dda2;box-shadow:0 0 0 1px #edf7dc}
    .vendor-card b{font-size:14px;font-weight:650;line-height:1.3;grid-column:1/-1;display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;min-width:0}
    .vendor-card span{display:block;color:#8a8e95;font-size:12px;line-height:1.4;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;min-width:0}
    .vendor-card em{font-style:normal;color:#648c11;font-size:11px;line-height:1.4;font-weight:650;max-width:100px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
    .empty{grid-column:1/-1;color:#8a8e95;font-size:12px;padding:25px 5px}
    .detail{border:1px solid #e2e4e8;border-radius:12px;background:#f7f8fa;padding:16px;margin-top:16px}
    .detail-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
    .detail h3{margin:0 0 5px;font-size:19px;font-weight:700;letter-spacing:-.035em;overflow-wrap:anywhere}
    .detail-sub{color:#71757d;font-size:12px;margin:0;overflow-wrap:anywhere}
    .detail-ops{display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap}
    .detail-ops button{border:1px solid #dfe2e6;background:#fff;color:#62676f;font-size:11px;font-weight:600;padding:8px 10px;border-radius:8px;min-height:34px}
    .detail-ops button.danger{color:var(--danger)}
    .detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin:16px 0}
    .field small{display:block;color:#8a8e95;font-size:11px;margin-bottom:5px}
    .field b{font-size:13px;line-height:1.5;font-weight:600;overflow-wrap:anywhere}
    .field b.blank{color:#9da2aa;font-weight:500}
    .detail-note{font-size:12px;line-height:1.6;color:#71757d;padding:9px 11px;background:#fff;border-radius:9px;min-height:36px;margin-bottom:12px;white-space:pre-wrap;overflow-wrap:anywhere}
    .detail-actions{display:flex;gap:7px}
    .detail-actions a,.detail-actions button{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;text-align:center;border:1px solid #dfe2e6;border-radius:10px;background:#fff;color:#52565d;font-size:12px;font-weight:650;padding:11px 8px;flex:1;min-height:42px}
    .detail-actions a:first-child{background:#151619;color:#fff;border-color:#151619}
    .detail-actions .disabled{opacity:.45;pointer-events:none}
    .info-foot{font-size:11px;line-height:1.5;color:#959aa2;margin:12px 1px 0}
    .modal-backdrop{position:fixed;inset:0;background:rgba(17,18,20,.38);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}
    .modal-backdrop.open{display:flex}
    .modal{background:#fff;width:min(620px,100%);max-height:calc(100dvh - 36px);overflow:auto;border-radius:18px;padding:25px;box-shadow:0 25px 80px #0003}
    .modal header{display:flex;justify-content:space-between;align-items:center}
    .modal h2{margin:0;font-size:22px;letter-spacing:-.04em}
    .modal header button{border:0;background:#f0f2f5;border-radius:8px;width:30px;height:30px;font-size:18px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}
    .form-grid label{display:block;font-size:11px;font-weight:900;color:#62676f}
    .form-grid input,.form-grid textarea{display:block;width:100%;border:1px solid #dde0e4;border-radius:10px;background:#fafbfc;padding:10px;margin-top:6px;font-size:13px;color:#18191b}
    .form-grid textarea{min-height:70px;resize:vertical}
    .form-grid .wide{grid-column:1/-1}
    .form-actions{display:flex;justify-content:flex-end;gap:8px}
    .form-actions button{padding:10px 15px;border-radius:9px;border:1px solid var(--line);background:#fff;color:#62676f;font-size:12px;font-weight:900}
    .form-actions .primary{background:var(--ink);color:#fff;border-color:var(--ink)}
    .toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:calc(100vw - 28px);background:#111214;color:#fff;padding:10px 15px;border-radius:9px;z-index:20;font-size:12px;box-shadow:0 9px 25px #0002}
    .toast[hidden]{display:none}

    .field{min-width:0}
    .detail-top>div:first-child{min-width:0;flex:1 1 160px}
    .vendor-card:hover{background:#fafbfc;border-color:#cfd2d7}
    .vendor-card.selected{background:#f7fbef}
    .region-shortcuts{display:none}
    .map-toggle{display:none}
    @container(min-width:640px){
      .vendor-list{grid-template-columns:repeat(3,minmax(0,1fr))}
      .detail-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
    @container(min-width:1020px){
      .vendor-list{grid-template-columns:repeat(4,minmax(0,1fr))}
    }
    @media(max-width:1199px){
      .shell{grid-template-columns:minmax(0,1fr)}
      .sidebar{display:none}
      .main{padding:22px}
    }
    @media(max-width:899px){
      .main{padding:20px}
      .workspace{grid-template-columns:minmax(0,1fr);gap:14px}
      .map-panel{position:static;display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,.85fr);grid-template-rows:auto auto auto auto 1fr;gap:10px 20px}
      .panel-header,.map-panel>.search,.filter-row,.unlocated,.map-foot{grid-column:1;margin:0}
      .panel-header{grid-row:1}
      .map-panel>.search{grid-row:2}
      .filter-row{grid-row:3}
      .unlocated{grid-row:4}
      .map-foot{grid-row:5;align-self:end}
      .map-area{grid-column:2;grid-row:1/6;aspect-ratio:auto;height:308px}
      .vendor-list{height:352px}
    }
    @media(max-width:599px){
      .main{padding:18px 12px calc(20px + env(safe-area-inset-bottom))}
      .top{gap:14px;margin-bottom:12px}
      .top h1{font-size:25px}
      .top p:last-child{font-size:12px;line-height:1.6}
      .actions{width:100%;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px}
      .actions button{min-width:0;padding:10px 4px;min-height:44px;font-size:11px;letter-spacing:-.05em}
      .statusbar{font-size:10px;gap:6px;margin-bottom:12px}
      .statusbar .save-status{margin-left:0;width:100%}
      .panel{border-radius:16px}
      .map-panel{display:flex;padding:15px;gap:0}
      .panel-header{flex-direction:row;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
      .panel-header h2{font-size:17px}
      .panel-header small{display:none}
      .map-toggle{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:#fff;color:#62676f;font-size:12px;font-weight:700;white-space:nowrap}
      .search{font-size:16px;height:46px}
      .search::placeholder{font-size:12px}
      .filter-row{margin:9px 0;width:100%}
      .filter-row select,.filter-row button{font-size:16px;min-height:44px}
      .filter-row button{font-size:12px}
      .unlocated{width:100%;min-height:44px;margin-bottom:10px}
      .map-area{display:none;height:270px;min-height:0;aspect-ratio:auto}
      .map-panel.map-expanded .map-area{display:block}
      .map-foot{margin-top:9px;font-size:10px;gap:3px;align-self:stretch}
      .map-foot span:last-child{display:none}
      .region-shortcuts{display:flex;gap:6px;overflow:auto;scrollbar-width:none;max-width:100%;padding:3px 1px;margin-top:9px;flex:none}
      .region-shortcuts button{flex:none;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;color:#62676f;font-size:12px;font-weight:700}
      .region-shortcuts button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
      .info-panel{padding:15px}
      .area-heading h2{font-size:24px}
      .list-tools button{min-height:44px}
      .vendor-list{height:352px;grid-auto-rows:80px;gap:8px;padding:3px}
      .vendor-card{padding:10px;gap:8px 4px}
      .vendor-card b{font-size:13px}
      .vendor-card span,.vendor-card em{font-size:11px}
      .vendor-card em{max-width:54px}
      .detail{padding:13px;margin-top:13px}
      .detail-top>div:first-child{flex-basis:100%}
      .detail-ops{width:100%}
      .detail-ops button{flex:1;min-height:44px;font-size:12px}
      .detail-grid{gap:13px 10px}
      .detail-actions a{min-height:46px;font-size:13px}
      .modal-backdrop{padding:10px}
      .modal{padding:20px 16px;max-height:calc(100dvh - 20px)}
      .modal header button{width:44px;height:44px}
      .form-grid{grid-template-columns:minmax(0,1fr)}
      .form-grid .wide{grid-column:1}
      .form-grid label{font-size:13px}
      .form-grid input,.form-grid textarea{font-size:16px;min-height:46px}
      .form-actions button{min-height:44px;font-size:14px}
    }
    @media(max-width:359px){
      .actions{grid-template-columns:repeat(2,minmax(0,1fr))}
      .panel-header{flex-direction:column;align-items:flex-start}
      .vendor-list{grid-template-columns:minmax(0,1fr)}
      .vendor-card em{max-width:100px}
    }
    @media(pointer:coarse) and (min-width:600px){
      .actions button,.filter-row button,.filter-row select,.unlocated,.list-tools button,.detail-ops button{min-height:44px}
      .search,.filter-row select,.form-grid input,.form-grid textarea{font-size:16px}
    }

    html,body{background:transparent}
    .shell{display:block;min-height:0;background:transparent}
    .main{padding:2px 2px 22px!important}
    .top>div:first-child{display:none}
    .top{justify-content:flex-end;margin-bottom:12px}
    .map-panel{position:static}
    .modal-backdrop{align-items:flex-start;padding-top:20px}
    .modal{max-height:calc(100dvh - 40px)}
    .top .actions{width:auto}
    @media(max-width:599px){.top .actions{width:100%}.main{padding-bottom:26px!important}}
</style>

</head>
<body>
  <div class="shell">

    <main class="main">
      <header class="top"><div><p class="eyebrow">MIN WORKS</p><h1>협력업체</h1><p>지역별 업체와 연락처를 한눈에 확인하세요.</p></div><div class="actions"><button id="exportBtn">연락망 백업</button><button id="importBtn">자료 가져오기</button><button id="refreshBtn">새로고침</button><button class="primary" id="addBtn">＋ 업체 등록</button><input id="importInput" type="file" accept=".json,application/json" hidden></div></header>
      <div class="statusbar"><b>직원 공용</b><span id="totalStatus">연락처 불러오는 중</span><span>지도는 지역 단위 표시</span><span class="save-status" id="saveStatus">회사 자료 연결 중</span></div>
